version: "3.8"

# =============================================================================
# MONITORING STACK
# =============================================================================
# Everything that stores state is pinned to the manager (the master node).
# node-exporter and cadvisor are GLOBAL — they land automatically on every
# worker the autoscaler creates, with no extra configuration.
#
# RESERVATIONS ARE LOAD-BEARING HERE, TWICE OVER.
#
#   1. Swarm's scheduler subtracts them when placing tasks. Without them it sees
#      an idle 4 vCPU / 8 GB master and packs api-prod on top of VictoriaMetrics
#      until something is OOM-killed — and the thing that dies is the monitoring
#      you would use to find out.
#   2. The autoscaler reads them to work out how many replicas each node can
#      hold. That is the whole of its capacity model now: there is no
#      REPLICAS_PER_WORKER constant to fall back on. Understate a reservation
#      here and it will believe in room that does not exist.
#
# They are a floor the scheduler must respect, not a limit on what a service may
# actually use. The global services below are reserved for the same reason: they
# land on EVERY node, so their cost has to come off a new worker's advertised
# size before the rest is treated as app capacity.
#
# THE NUMBERS ARE MEASURED. They used to be guesses sized for the 4 vCPU master
# the README specifies, and on a 2 vCPU one they reserved 1.75 of 2.00 cores and
# 2.3 of 3.7 GB between them — to run services whose combined q90 usage was 0.04
# cores and whose combined peak was 491 MB. The consequence was not slowness: it
# was that no application could fit on the master at all, so the cluster kept a
# worker billed around the clock to hold one idle replica and could never reach
# the free single-host state this whole design exists to reach.
#
# Re-measure before changing them:
#   quantile_over_time(0.90, max by (container_label_com_docker_swarm_service_name)
#     (rate(container_cpu_usage_seconds_total{...}[5m]))[3h:1m])
# VictoriaMetrics and Loki keep several times their observed peak, because they
# are the two that grow with how much you store.
# =============================================================================

# RESERVATIONS ARE APP CAPACITY SPENT, NOT A COMFORT SETTING.
#
# The autoscaler measures a node's room for applications as its real size MINUS
# the reservations of everything on it that is not an app. So every megabyte
# reserved here is a megabyte it will not place a replica in — and when the
# replicas stop fitting, it buys a Hetzner worker. Over-reserving infrastructure
# does not make the cluster safer; it makes it more expensive, silently, at the
# moment traffic arrives.
#
# The numbers below are MEASURED, not guessed: peak CPU and peak memory working
# set per service over 7 days, put through the same headroom rule the autoscaler
# applies when it resizes a component, so infrastructure and applications are
# sized by one convention rather than two.
#
#   cpu = max(peak x CPU_RESERVE_HEADROOM, CPU_RESERVE_FLOOR)   # 2.0, 0.02
#   mem = max(peak x MEM_RESERVE_HEADROOM, MEM_RESERVE_FLOOR_MB) # 1.5, 32
#
# CPU is deliberately generous relative to observed load and still tiny: none of
# these carry a CPU limit, so a low reservation costs scheduling preference, not
# throughput. Memory is the one that kills a container, which is why it gets the
# true maximum rather than a quantile.
#
# Two are held above the formula on purpose, because their footprint tracks the
# SIZE OF THE CLUSTER rather than last week's load: victoriametrics grows with
# active time series, cadvisor with the number of containers on the node. Loki
# grows with log volume and is given room beyond its measured peak for the same
# reason. Re-measure after adding components; a reservation copied forward from
# a smaller cluster is the same mistake in the other direction.
#
# node-exporter and cadvisor are `global`, so their reservations are a per-node
# tax that comes off EVERY worker's advertised capacity, not just the master's.

x-manager-only: &manager-only
  placement:
    constraints: [node.role == manager]

# WIRING ONLY. Every SETTING the overseer reads arrives through the env_file
# below instead of being listed here.
#
# Listing them was a third edit nobody could see the need for: the panel offered
# a knob, the autoscaler read it, and if the pipe between them was missing the
# panel saved a value the autoscaler silently ignored in favour of its default.
# `env_file` names a FILE, so the list lives in admin/settings_def.py — beside
# the descriptions and defaults — and bin/render-fleet-env turns it into
# /etc/infra/fleet.env on every monitoring deploy.
#
# What is left here is not configuration: an address inside the overlay, a grace
# period nobody tunes, and a path into a bind mount. `environment` also wins over
# `env_file`, so anything that must not be overridable belongs here.
x-fleet-env: &fleet-env
  VM_URL: "http://victoriametrics:8428"
  POST_DRAIN_GRACE_SECONDS: "45"
  WORKER_USERDATA_PATH: "/etc/infra/worker-cloud-init.yaml"

x-autoscaler-base: &autoscaler-base
  # Pinned to a commit, and exported by bin/stack-deploy from
  # bin/infra-images. Never `:latest`: a tag that does not change is a
  # service spec that does not change, and Swarm has nothing to roll.
  image: ${INFRA_IMAGE_AUTOSCALER}
  # NO HCLOUD_TOKEN. This process cannot create or delete a server any more;
  # the fleet belongs to the overseer. The socket stays read-write because it
  # still changes service specs — replica counts, placement constraints and
  # measured reservations.
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
  networks: [monitoring]
  deploy:
    replicas: 1
    placement:
      constraints: [node.role == manager]
    labels:
      prometheus.scrape: "true"
      prometheus.port: "9200"
      prometheus.path: "/metrics"
      # THE AUTOSCALER IS A MANAGER, and this is its whole subscription. It
      # claims `local` — the one cause more replicas can fix — and says where to
      # deliver. The overseer reads these three labels off the service list;
      # nothing anywhere is configured with this service's address, so dataguard
      # is the same three labels on a different service and no edit here.
      infra.handles: "local"
      infra.handles.port: "9201"
      infra.handles.path: "/signal"
    resources:
      reservations: { cpus: "0.03", memory: 48M }
    restart_policy:
      condition: any
      delay: 30s

services:

  # --- metrics store --------------------------------------------------------
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.106.1
    command:
      - "--storageDataPath=/vmdata"
      - "--retentionPeriod=30d"
      - "--httpListenAddr=:8428"
      - "--memory.allowedPercent=40"
    volumes:
      - vmdata:/vmdata
    networks: [monitoring]
    deploy:
      replicas: 1
      <<: *manager-only
      resources:
        limits:       { memory: 1500M }
        # 448M, raised from 352M. Measured 24h peak here was 346M — six
        # megabytes of margin on the one service that grows with retention,
        # and the only one whose death takes every metric and every alert
        # with it. An under-reservation is not free capacity, it is an
        # overcommitted node that OOM-kills the thing you would use to find
        # out why.
        reservations: { cpus: "0.02", memory: 448M }

  # --- scraper with Swarm service discovery ---------------------------------
  # Discovers new nodes and app tasks automatically. This is why adding a
  # worker requires zero monitoring configuration.
  vmagent:
    image: victoriametrics/vmagent:v1.106.1
    command:
      - "--promscrape.config=/etc/vmagent/vmagent.yml"
      - "--remoteWrite.url=http://victoriametrics:8428/api/v1/write"
      - "--promscrape.config.strictParse=false"
    volumes:
      - /opt/infra/config/vmagent.yml:/etc/vmagent/vmagent.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [monitoring]
    deploy:
      replicas: 1
      <<: *manager-only   # dockerswarm_sd requires a manager socket
      resources:
        # 48M, from 64M: measured 24h peak 36M.
        reservations: { cpus: "0.03", memory: 48M }

  # --- alerting -------------------------------------------------------------
  vmalert:
    image: victoriametrics/vmalert:v1.106.1
    command:
      - "--datasource.url=http://victoriametrics:8428"
      - "--remoteWrite.url=http://victoriametrics:8428"
      - "--notifier.url=http://alertmanager:9093"
      - "--rule=/etc/alerts/*.yml"
    volumes:
      - /opt/infra/config/alerts.yml:/etc/alerts/alerts.yml:ro
    networks: [monitoring]
    deploy:
      replicas: 1
      <<: *manager-only
      resources:
        reservations: { cpus: "0.02", memory: 32M }

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - /opt/infra/config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    # No `secrets:` here on purpose. The bot token is rendered into the config
    # file bin/stack-deploy generates, because a docker secret cannot be absent
    # (the stack would refuse to deploy at all when alerting is unconfigured)
    # and cannot be changed in place (Swarm secrets are immutable, so the panel
    # could never edit it). The file is 0600 on the master, which is the same
    # trade every component's credentials make.
    environment:
      # Not read by Alertmanager. It is here so that the SERVICE SPEC changes
      # when the mounted config does — Swarm rolls a task on a spec change and
      # is blind to a bind mount, so without this a re-rendered config never
      # reached the running process and alerting kept using whatever it loaded
      # at startup. bin/stack-deploy computes it.
      ALERTMANAGER_CONFIG_SHA: "${ALERTMANAGER_CONFIG_SHA}"
    networks: [monitoring]
    deploy:
      replicas: 1
      <<: *manager-only
      labels:
        # Scraped so that FAILING TO DELIVER is a number somebody can alert on.
        # Alertmanager was the one service in the monitoring stack nothing
        # watched, which is how a notifier that had been answering 401 for two
        # days looked exactly like a quiet cluster.
        prometheus.scrape: "true"
        prometheus.port: "9093"
        prometheus.path: "/metrics"
      resources:
        reservations: { cpus: "0.02", memory: 32M }

  # --- logs -----------------------------------------------------------------
  loki:
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - /opt/infra/config/loki.yml:/etc/loki/loki.yml:ro
      - lokidata:/loki
    ports:
      # published on the private network so worker log drivers can reach it
      - target: 3100
        published: 3100
        protocol: tcp
        mode: host
    networks: [monitoring]
    deploy:
      replicas: 1
      <<: *manager-only
      resources:
        # 160M, from 224M: measured 24h peak 125M.
        reservations: { cpus: "0.02", memory: 160M }

  # --- dashboards -----------------------------------------------------------
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      # THE PANEL'S OWN LOGIN. Grafana is served through the panel, behind the
      # panel's session, so a second admin password was a second thing to
      # rotate and nothing extra to breach. Grafana applies it when its
      # database is first created and never again, which is why changing
      # ADMIN_PASSWORD later does not move this one.
      GF_SECURITY_ADMIN_USER: "${ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/ADMIN_PASSWORD
      GF_USERS_ALLOW_SIGN_UP: "false"
      # BEHIND THE PANEL, not on a hostname of its own. Every metric this
      # cluster has ever recorded used to sit behind a second login page on the
      # public internet; the panel already holds a session for exactly this
      # operator, so Grafana is served through it the same way the database
      # consoles are. `serve_from_sub_path` is what makes Grafana emit its own
      # asset URLs under that prefix instead of at the root, where they would
      # collide with the panel's `/static` and 404.
      #
      # The `grafana-<app>.<root>` tunnel hostname, if you still have one, keeps
      # working at `/grafana/` — only its bare root now redirects here. Deleting
      # it in the Zero Trust dashboard is one fewer public door.
      GF_SERVER_ROOT_URL: "https://admin-${APP_NAME}.${ROOT_DOMAIN}/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    secrets: [ADMIN_PASSWORD]
    volumes:
      - grafanadata:/var/lib/grafana
      - /opt/infra/config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/ds.yml:ro
    networks: [monitoring]
    deploy:
      replicas: 1
      <<: *manager-only
      resources:
        # 96M, from 112M: measured 24h peak 60M.
        reservations: { cpus: "0.02", memory: 96M }

  # --- per-node exporters (global = every current AND future node) ----------
  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - "--path.rootfs=/host"
      - "--collector.systemd"
    volumes:
      - /:/host:ro,rslave
    ports:
      - target: 9100
        published: 9100
        protocol: tcp
        mode: host
    networks: [monitoring]
    deploy:
      mode: global
      resources:
        # 24M, from 32M: measured 24h peak 11M.
        reservations: { cpus: "0.02", memory: 24M }

  cadvisor:
    # >= v0.55 is load-bearing, and the failure it fixes is silent.
    #
    # Docker 29 renamed its storage driver from `overlay2` to `overlayfs`.
    # cadvisor v0.49 does not know that name, so it cannot resolve any
    # container's read-write layer, drops EVERY container, and exports only the
    # root cgroup — one series, with no `container_label_*` labels on it at all.
    #
    # Nothing looks broken: the service is 1/1, the scrape succeeds, and the
    # metric names all exist. But the autoscaler's CPU-per-replica query filters
    # on container_label_com_docker_swarm_service_name != "", which matches
    # nothing, so cpu/replica reads n/a forever. That is the signal that exists
    # to authorise scaling DOWN when the latency histogram is empty at low
    # traffic — so losing it silently means the fleet never shrinks.
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    command: ["--docker_only=true", "--housekeeping_interval=15s"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - target: 8080
        published: 8081
        protocol: tcp
        mode: host
    networks: [monitoring]
    deploy:
      mode: global
      resources:
        # 128M, raised from 96M: the measured 24h peak is 90M. cadvisor is
        # where every per-container CPU and memory number comes from, so
        # losing it silently blinds right-sizing and scale-down at once.
        reservations: { cpus: "0.04", memory: 128M }

  # --- the overseer ---------------------------------------------------------
  # What is happening, what it means, and what the fleet should be.
  #
  # It measures every application, works out WHY a slow one is slow, and owns
  # the Hetzner fleet outright: how many machines exist, of what size, and which
  # of them may be deleted. That last part used to be the autoscaler's, and
  # moved here when a SECOND manager wanted machines — dataguard has to buy a
  # node to put a database replica on, and two processes racing on fleet size
  # with two copies of the capacity arithmetic was never going to end well.
  #
  # It therefore holds HCLOUD_TOKEN and mounts the socket READ-WRITE, which the
  # dispatcher it grew out of deliberately did not. See overseer/overseer.py for
  # what that cost and what guards it.
  #
  # A manager subscribes by labelling ITS OWN service `infra.handles=<cause>`.
  # Nothing here lists managers.
  overseer:
    image: ${INFRA_IMAGE_OVERSEER}
    secrets: [HCLOUD_TOKEN]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/infra/config/worker-cloud-init.yaml:/etc/infra/worker-cloud-init.yaml:ro
    networks: [monitoring]
    # Rendered by bin/stack-deploy immediately before this file is deployed, and
    # read by the docker CLI here rather than mounted — the values end up in the
    # service spec, so changing a setting is a spec change Swarm actually acts on.
    env_file:
      - /etc/infra/fleet.env
    environment:
      <<: *fleet-env
    deploy:
      replicas: 1
      # Manager-only because it reads the node and service lists, which are
      # manager APIs. It carries no state and no volume, so this is the API's
      # requirement rather than a data one.
      <<: *manager-only
      labels:
        prometheus.scrape: "true"
        prometheus.port: "9210"
        prometheus.path: "/metrics"
      resources:
        # Larger than the dispatcher's, because the packer, the Hetzner
        # catalogue cache and the resize machine all live here now.
        # 64M, from 96M: measured 24h peak 33M. It holds the fleet model and
        # the capacity arithmetic, neither of which is large.
        reservations: { cpus: "0.04", memory: 64M }
      restart_policy:
        condition: any
        delay: 30s

  # --- dataguard ------------------------------------------------------------
  # The autoscaler's counterpart for stateful components: replica sets, sentinel
  # quorums, backups, restores and the machines they live on.
  #
  # It is on `edge` as well as `monitoring`, which nothing else in this stack is,
  # because it has to speak to mongod and redis — and they are on `edge`. That
  # widening is why its /signal receiver binds the monitoring interface only:
  # an application that could POST to it could rewrite its own database's
  # topology. See dataguard/dataguard.py.
  dataguard:
    image: ${INFRA_IMAGE_DATAGUARD}
    volumes:
      # Read-write: it creates and removes member services, and issues the
      # per-component TLS material they mount.
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/infra:/opt/infra
    networks: [monitoring, edge]
    env_file:
      - /etc/infra/fleet.env
    environment:
      VM_URL: "http://victoriametrics:8428"
      OVERSEER_URL: "http://monitoring_overseer:9211"
    deploy:
      replicas: 1
      # Manager-only, and for once that IS a data requirement as well as an API
      # one: the CA key it signs member certificates with lives in /opt/infra on
      # the master and never leaves it.
      <<: *manager-only
      labels:
        prometheus.scrape: "true"
        prometheus.port: "9203"
        prometheus.path: "/metrics"
        # DATAGUARD IS A MANAGER, and this is its whole subscription — the
        # extension point signals/classify.py has documented since before it
        # existed. It claims `database`, so the overseer stops alerting that
        # nothing owns a database bottleneck and dispatches it here instead.
        infra.handles: "database"
        infra.handles.port: "9202"
        infra.handles.path: "/signal"
      resources:
        reservations: { cpus: "0.03", memory: 64M }
      restart_policy:
        condition: any
        delay: 30s

  # --- the autoscaler -------------------------------------------------------
  # Applies what the overseer decides to application services: replica counts,
  # placement constraints, and reservations measured from real usage.
  autoscaler:
    <<: *autoscaler-base
    environment:
      VM_URL: "http://victoriametrics:8428"

networks:
  monitoring:
    # `name` is load-bearing. Without it the stack namespaces this network as
    # `monitoring_monitoring`, while stacks/ingress.yml and stacks/admin.yml
    # declare `monitoring` as external and look for that literal name — so both
    # fail to deploy with "network monitoring is declared as external, but
    # could not be found", after the monitoring stack has come up perfectly.
    # This stack creates the network the other two consume; the name is the
    # contract between them.
    name: monitoring
    driver: overlay
    attachable: true

  # Declared external, never created here. `edge` is made by bootstrap.sh before
  # any stack exists, and every component declares it the same way — no stack
  # may own a network another stack needs. Only dataguard joins it from here,
  # because it is the only infrastructure service that has to talk to a
  # database rather than about one.
  edge:
    external: true

volumes:
  vmdata:
  lokidata:
  grafanadata:

secrets:
  HCLOUD_TOKEN:
    external: true
  ADMIN_PASSWORD:
    external: true
