version: "3.8"

# =============================================================================
# APP STACK — both environments, ONE tunnel
# =============================================================================
#   docker stack deploy --with-registry-auth -c stacks/app.yml app
#
# NETWORKS
#   edge          cloudflared + both api services. Shared, so one connector
#                 can route to either environment by service name.
#   data-prod     api-prod  <-> redis-prod    (staging cannot reach it)
#   data-staging  api-staging <-> redis-staging
#
# CLOUDFLARE — one tunnel, two public hostnames, both pointing at service DNS
# names on the edge network:
#   <app>.<root>          ->  http://api-prod:<APP_PORT>
#   staging-<app>.<root>  ->  http://api-staging:<APP_PORT>
# Cloudflare's free Universal SSL covers one subdomain level only, which is why
# staging and the admin UIs use a dash rather than a fourth level.
#
# Service names are distinct on purpose. If both were called `api`, DNS on the
# shared edge network would be ambiguous and cloudflared would round-robin
# between your environments.
# =============================================================================

# PLACEMENT — no node.role constraint here, ON PURPOSE. The autoscaler owns it.
#
# These services used to be pinned to `node.role == worker`. That made a
# master-owned floor impossible: draining the last worker left every task pending
# and the site down. The master is host #1 now, so placement has to move:
#
#   no workers   -> no constraint, the master runs the app, nothing is billed
#   any workers  -> `node.role == worker` is added, the master runs none
#
# autoscaler.py adds and removes that constraint with `docker service update
# --constraint-add/--constraint-rm`, ordered so a healthy replica is serving
# throughout the handover. Setting it here instead would fight it: every stack
# deploy would slam placement back to whatever this file says, at whatever
# moment CI happened to ship. `bin/app-env` reads the live constraint and
# re-states it for exactly that reason — see the header there.
#
# What DOES belong here is the spread preference. Swarm balances tasks across
# eligible nodes by count, which is what makes the handover converge: the master
# holds no tasks of this service when the pin is released, so it wins the next
# placement and starts serving before the last worker is deleted.
#
# Do NOT add `max_replicas_per_node`. It looks like the obvious safety cap and
# it deadlocks `order: start-first`: on a full cluster the new task has nowhere
# to be scheduled while the old one is still running, so the rolling update
# hangs rather than failing. The autoscaler's own arithmetic is the cap, and the
# resource reservations in monitoring.yml are the backstop.
x-app-placement: &app-placement
  preferences:
    - spread: node.id

x-loki-logging: &loki-logging
  driver: loki
  options:
    loki-url: "http://${MASTER_PRIVATE_IP}:3100/loki/api/v1/push"
    loki-retries: "3"
    loki-batch-size: "400"
    mode: "non-blocking"
    max-buffer-size: "4m"

# Rolling-update policy shared by both environments.
#   order: start-first    new task is healthy BEFORE the old one stops
#   monitor: 90s          how long a task must stay healthy to count as good.
#                         The default is 5s — shorter than JVM startup, so
#                         Swarm would declare success before your app booted.
#   failure_action        automatic rollback, no human in the loop
x-update-policy: &update-policy
  parallelism: 1
  order: start-first
  delay: 15s
  monitor: 90s
  max_failure_ratio: 0
  failure_action: rollback

x-rollback-policy: &rollback-policy
  parallelism: 1
  order: start-first
  delay: 5s

services:

  # ==========================================================================
  # PRODUCTION
  # ==========================================================================
  api-prod:
    image: ${APP_IMAGE_PROD}
    # Only topology lives here. Everything the app reads with System.getenv —
    # including MONGO_URI and REDIS_PASSWORD — comes from config/app-prod.env,
    # layered on as an override by bin/app-env. That file is what the admin UI
    # edits, and it is the single source for both the app and redis-prod.
    environment:
      KTOR_ENV: production
      REDIS_HOST: redis-prod
      REDIS_PORT: "6379"
    networks: [edge, data-prod, monitoring]
    logging: *loki-logging
    # Ktor needs time to finish in-flight requests when drained. Pair this with
    # a shutdown hook in your app; the default 10s will cut live requests.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${APP_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s        # JVM cold start + JIT warmup
    deploy:
      # The autoscaler owns this number at runtime. The value here is only the
      # count used on first deploy.
      replicas: ${MIN_REPLICAS}
      labels:
        prometheus.scrape: "true"
        prometheus.port: "${APP_PORT}"
        prometheus.path: "${APP_METRICS_PATH}"
        app.env: "prod"
      placement: *app-placement
      update_config: *update-policy
      rollback_config: *rollback-policy
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:      { cpus: "1.0", memory: 768M }
        reservations: { cpus: "0.5", memory: 384M }

  redis-prod:
    # REDIS_PASSWORD is injected from config/app-prod.env by bin/app-env, the
    # same file the app reads it from. One value, one place — changing it in
    # the admin UI moves the server and its clients together.
    image: redis:7.4-alpine
    command: >
      sh -c 'exec redis-server
      --requirepass "$$REDIS_PASSWORD"
      --appendonly yes --appendfsync everysec
      --maxmemory 512mb --maxmemory-policy allkeys-lru'
    volumes: [redis-prod-data:/data]
    networks: [data-prod]
    logging: *loki-logging
    deploy:
      replicas: 1
      placement: { constraints: [node.role == manager] }
      labels: { app.env: "prod" }
      resources:
        # Sized from --maxmemory 512mb plus AOF overhead. Manager-pinned, so
        # this is capacity the autoscaler must not offer to app replicas.
        reservations: { cpus: "0.20", memory: 640M }

  # ==========================================================================
  # STAGING — one capped replica, wherever there is room
  # ==========================================================================
  api-staging:
    image: ${APP_IMAGE_STAGING}
    environment:
      KTOR_ENV: staging
      REDIS_HOST: redis-staging
      REDIS_PORT: "6379"
    networks: [edge, data-staging, monitoring]
    logging: *loki-logging
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${APP_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
      labels:
        prometheus.scrape: "true"
        prometheus.port: "${APP_PORT}"
        prometheus.path: "${APP_METRICS_PATH}"
        app.env: "staging"
      placement: *app-placement
      update_config: *update-policy
      rollback_config: *rollback-policy
      restart_policy:
        condition: any
        delay: 5s
      resources:
        # Hard cap. This is what keeps staging from distorting the cluster.
        limits:      { cpus: "0.5", memory: 512M }
        reservations: { cpus: "0.1", memory: 128M }

  redis-staging:
    image: redis:7.4-alpine
    command: >
      sh -c 'exec redis-server
      --requirepass "$$REDIS_PASSWORD"
      --appendonly yes --appendfsync everysec
      --maxmemory 128mb --maxmemory-policy allkeys-lru'
    volumes: [redis-staging-data:/data]
    networks: [data-staging]
    logging: *loki-logging
    deploy:
      replicas: 1
      placement: { constraints: [node.role == manager] }
      labels: { app.env: "staging" }
      resources:
        reservations: { cpus: "0.05", memory: 192M }

  # ==========================================================================
  # INGRESS — ONE tunnel, one connector per worker
  # ==========================================================================
  cloudflared:
    image: cloudflare/cloudflared:2024.10.1
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/CF_TUNNEL_TOKEN
    secrets: [CF_TUNNEL_TOKEN]
    networks: [edge, monitoring]
    logging: *loki-logging
    stop_grace_period: 45s     # cloudflared drains edge connections on SIGTERM
    deploy:
      # Global with no role constraint, so the MANAGER always has a connector
      # too. This is load-bearing for scale-to-zero: at zero workers it is the
      # only ingress there is, and when the last worker is drained the master's
      # connector is already registered with Cloudflare, so the tunnel never
      # goes dark mid-scale-down.
      mode: global
      resources:
        # Global, so this is a per-node tax the autoscaler subtracts from a new
        # worker's size before counting app capacity.
        reservations: { cpus: "0.05", memory: 32M }
      labels:
        prometheus.scrape: "true"
        prometheus.port: "2000"
        prometheus.path: "/metrics"
      restart_policy:
        condition: any
        delay: 10s

  redis-exporter-prod:
    image: oliver006/redis_exporter:v1.66.0
    # REDIS_PASSWORD also injected from config/app-prod.env.
    environment:
      REDIS_ADDR: "redis://redis-prod:6379"
    networks: [data-prod, monitoring]
    deploy:
      replicas: 1
      placement: { constraints: [node.role == manager] }
      resources:
        reservations: { cpus: "0.05", memory: 32M }
      labels:
        prometheus.scrape: "true"
        prometheus.port: "9121"
        prometheus.path: "/metrics"
        app.env: "prod"

networks:
  edge:
    driver: overlay
    attachable: true
  data-prod:
    driver: overlay
  data-staging:
    driver: overlay
  monitoring:
    external: true

volumes:
  redis-prod-data:
  redis-staging-data:

secrets:
  # Only the tunnel token remains a docker secret here. Application
  # credentials (MONGO_URI, REDIS_PASSWORD) are plain env vars in
  # config/app-<env>.env so the admin UI can edit them — see the tradeoff note
  # in the README.
  CF_TUNNEL_TOKEN: { external: true }