name: build and deploy

# Push to main       -> build, push, deploy to STAGING automatically
# Tag v*  or manual  -> deploy the same immutable image to PRODUCTION
#
# There is no :latest anywhere. Every build produces sha-<short> and Swarm is
# told that exact string, which is what makes the deploy real and the rollback
# possible. Telling Swarm an unchanged reference is a silent no-op.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing tag to promote to production (e.g. sha-abc1234)"
        required: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false      # never cancel a half-finished rollout

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}
          # Layer cache keeps the app layer thin, which keeps cold-pull time on
          # a freshly autoscaled worker down.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Roll staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.MASTER_HOST }}
          username: deploy
          key: ${{ secrets.MASTER_SSH_KEY }}
          script: |
            set -e
            docker service update \
              --with-registry-auth \
              --image ghcr.io/${{ github.repository }}:${{ needs.build.outputs.tag }} \
              app_api-staging
            # `docker service update` blocks until convergence and exits
            # non-zero if Swarm rolled back, so a failed deploy fails the job.

  promote:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production      # add a required reviewer here for a gate
    steps:
      - name: Resolve tag
        id: t
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Roll production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.MASTER_HOST }}
          username: deploy
          key: ${{ secrets.MASTER_SSH_KEY }}
          script: |
            set -e
            docker service update \
              --with-registry-auth \
              --image ghcr.io/${{ github.repository }}:${{ steps.t.outputs.tag }} \
              app_api-prod
