#cloud-config
# =============================================================================
# MASTER NODE CLOUD-INIT  —  paste this into Hetzner "Cloud config" on create
# =============================================================================
# EDIT ONLY THE BLOCK MARKED "VARIABLES". Everything below it is generic.
#
# Server: CPX31 (4 vCPU / 8 GB). The master runs the admin panel, both Redis
# instances, VictoriaMetrics, Loki, Grafana and the autoscaler. It runs
# NO application tasks and NO cloudflared — ingress lives entirely on the
# workers, so losing this box costs you monitoring and scaling, not uptime.
#
# Attach the server to a Hetzner private network BEFORE creating it.
# =============================================================================

package_update: true
package_upgrade: true

packages:
  - curl
  - jq
  - git
  - ufw
  - unzip
  - gettext-base
  - ca-certificates
  - gnupg
  # bin/component renders component stacks with it, on the host, outside the
  # panel's container. Ubuntu's python3 does not ship PyYAML.
  - python3-yaml

write_files:
  # ---------------------------------------------------------------------------
  # VARIABLES  — the only section you need to touch
  # ---------------------------------------------------------------------------
  - path: /etc/infra/infra.env
    permissions: "0600"
    owner: root:root
    content: |
      # --- identity -----------------------------------------------------------
      # APP_NAME does three jobs: the Hetzner label namespace the autoscaler is
      # allowed to touch, the worker hostname prefix, and the third-level
      # domain. If you run anything else in this Hetzner project, that label is
      # the only thing stopping the autoscaler from deleting it.
      APP_NAME=aichat
      ROOT_DOMAIN=mydomain.com

      # Cloudflare's free Universal SSL certificate covers *.mydomain.com and
      # nothing deeper, so every hostname stays at the third level and extra
      # services are separated by a dash rather than another dot:
      #   aichat.mydomain.com           production
      #   staging-aichat.mydomain.com   staging
      #   grafana-aichat.mydomain.com   dashboards
      #   admin-aichat.mydomain.com     admin panel

      # --- Hetzner ------------------------------------------------------------
      HCLOUD_TOKEN=REPLACE_ME
      HCLOUD_LOCATION=hel1
      HCLOUD_NETWORK_NAME=prod-net
      HCLOUD_SSH_KEY_NAME=my-laptop
      WORKER_IMAGE=ubuntu-24.04
      WORKER_TYPE=cpx22              # shared worker pool

      # --- container registry: FIRST BOOT ONLY --------------------------------
      # Used once, for the initial `docker login` so the very first deploy can
      # pull. After that the panel owns registry auth (Apps > API > Deployments),
      # which is per-registry and can be changed without touching this file.
      GHCR_USER=your-github-username
      GHCR_TOKEN=REPLACE_ME          # PAT with read:packages

      # --- Cloudflare: ONE tunnel, two public hostnames -----------------------
      # In Zero Trust, add both hostnames to the same tunnel:
      #   ${APP_NAME}.${ROOT_DOMAIN}          -> http://api-prod:8080
      #   staging-${APP_NAME}.${ROOT_DOMAIN}  -> http://api-staging:8080
      CF_TUNNEL_TOKEN=REPLACE_ME

      # --- Grafana ------------------------------------------------------------
      GRAFANA_ADMIN_USER=admin
      GRAFANA_ADMIN_PASSWORD=REPLACE_ME_LONG_RANDOM

      # --- Admin panel --------------------------------------------------------
      # The web console at admin-${APP_NAME}.${ROOT_DOMAIN}. It can deploy
      # anything in the cluster and read every credential in it, so this
      # password is the key to the whole thing: make it long and unique, and put the hostname
      # behind Cloudflare Access as a second factor.
      ADMIN_USER=admin
      ADMIN_PASSWORD=REPLACE_ME_LONG_RANDOM

      # --- Alerting (OPTIONAL, but you want it) ---------------------------------
      # Where alerts actually land. Telegram: create a bot with @BotFather, add
      # it to a group, and read the chat id from
      #   curl https://api.telegram.org/bot<TOKEN>/getUpdates
      # after sending one message there. Group ids are negative.
      #
      # Leave both blank and the cluster still boots — it just has nowhere to
      # send alerts, which every `stack-deploy monitoring` warns about, which
      # `smoke-test` reports as a failure rather than a skip, and which the
      # panel's Alerts page says outright. The generating, grouping and
      # dispatching all still work; only the last hop is missing, and that is
      # the one state of this pipeline that looks healthy from the inside.
      #
      # Both are rendered into config/alertmanager.yml (0600, root only) by
      # bin/stack-deploy — not into a docker secret, because a secret cannot be
      # absent and cannot be edited, and this has to be both. You can change it
      # later in the panel under Settings.
      ALERT_TELEGRAM_BOT_TOKEN=REPLACE_ME
      ALERT_TELEGRAM_CHAT_ID=REPLACE_ME

      # --- deploy access (OPTIONAL) -------------------------------------------
      # Your CI is your business, but whatever you build needs a way in that is
      # not root. Put a public key here and this script creates a `deploy` user
      # in the docker group with that key installed. Its CI then runs one
      # command per deploy:
      #   docker service update --with-registry-auth --image <img> <component>_app
      # Leave blank to skip entirely — the admin panel's deploy webhook is the
      # path most people want, and it needs nothing here.
      CI_SSH_PUBLIC_KEY=

      # --- Fleet -------------------------------------------------------------
      # NOTHING ABOUT YOUR APPLICATIONS LIVES IN THIS FILE.
      #
      # No image, no port, no SLO, no replica counts, no service names. Those
      # are properties of a component, and components are created after the
      # cluster is up — from the admin panel, or with `component create` on the
      # master. Each one gets its own Docker stack, its own env file and its own
      # scaling policy, carried as deploy labels on its own service. The
      # autoscaler discovers them; it is never told about them.
      #
      # What is left here is the fleet: how many machines may exist, of what
      # kind, and how eagerly they come and go.

      # HETZNER WORKERS. The master is NOT one of them — it is the control
      # plane, and it carries the load itself while no worker exists.
      #
      #   MIN_WORKERS=0  ->  nothing is billed; the master runs your components
      #   MIN_WORKERS=1  ->  one worker always up, so the master runs no
      #                      application traffic at all
      #   MAX_WORKERS=5  ->  at most five workers
      #
      # An idle cluster is therefore one box and no invoice.
      #
      # How much fits on a node is NOT configured. It is measured: each node's
      # real CPU and memory, minus what Swarm has already reserved there,
      # against the reservations of the replicas that have to be placed. A new
      # worker's size comes from the Hetzner catalogue for WORKER_TYPE. Change
      # the worker type, resize the master, or create another component, and the
      # arithmetic just follows. Existing workers are filled before another one
      # is bought.
      MIN_WORKERS=0
      MAX_WORKERS=5                  # a BUDGET cap, not a capacity plan

      # Vertical scaling: grow ONE worker onto the next plan up instead of
      # buying a second one. It sits between "more replicas" and "more workers".
      #
      # Set to 0 to turn OFF. Both are required — MAX_WORKERS counts
      # servers, so it cannot cap a change that raises the bill without changing
      # the count, and half a ceiling is no ceiling.
      #
      # A CAPACITY, never a plan name. Hetzner adds and retires plans and does
      # not sell the same family everywhere (cpx21 does not exist in hel1 at
      # all), so the ladder is read from the API — same family, architecture and
      # CPU type as WORKER_TYPE — and simply cut off here. WORKER_TYPE stays the
      # floor a worker is created at and shrinks back to.
      #
      #   WORKER_MAX_CORES=8 + WORKER_MAX_MEMORY_GB=16 with WORKER_TYPE=cpx22
      #   allows cpx22 -> cpx32 -> cpx42, then buys a worker instead.
      WORKER_MAX_CORES=8
      WORKER_MAX_MEMORY_GB=16
      # A resize power-cycles the machine, so it corrects the SHAPE of the fleet
      # slowly. The replica count is what tracks traffic.
      NODE_RESIZE_COOLDOWN_SECONDS=900

      # Placement guard, not a trigger: if a node is this loaded on CPU or
      # memory, another replica physically will not fit, so ask for a node.
      NODE_PRESSURE_PCT=80

      # Node cooldowns. Up must exceed node boot + image pull + app warmup or
      # you will overshoot; down is slow on purpose, because a deleted node
      # costs a full boot to get back.
      COOLDOWN_UP_SECONDS=300
      COOLDOWN_DOWN_SECONDS=900

      # Blank on purpose. A floor here overrides MIN_WORKERS for the hours it
      # covers, so `08:00-20:00=1` would keep one worker alive all day and the
      # free floor would only ever happen overnight. Set it only if you have a
      # known traffic window worth pre-warming for.
      SCHEDULE_FLOOR=                # UTC; "HH:MM-HH:MM=N" comma separated
      DRY_RUN=false

      # --- self-update --------------------------------------------------------
      # THE REPO IS THE SOURCE OF TRUTH. A timer polls this URL, compares the
      # commit it last applied against the branch head, and re-applies the
      # bundle when they differ — so changing infrastructure means pushing a
      # commit, not copying files onto a box.
      #
      # Without it the only way to change a running cluster was by hand, and the
      # master drifted away from the repo silently: "what is actually running"
      # stopped being a question git could answer.
      #
      # It carries a token, which is why infra.env is 0600. Use a fine-grained
      # PAT with read-only contents access to this ONE repo — it is on every
      # master you build, so its blast radius is every master you build.
      #
      # Leave it empty and the cluster simply never self-updates; that is a
      # supported state, not a broken one.
      INFRA_REPO_URL=https://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@github.com/dhng22/hetzner-infra.git
      INFRA_REPO_BRANCH=master
      # How often to ask whether the branch has moved. One `git ls-remote` per
      # tick, which is a single request that transfers nothing when nothing has
      # changed.
      INFRA_UPDATE_INTERVAL=5min

  # ---------------------------------------------------------------------------
  - path: /opt/infra/bootstrap.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      set -a; source /etc/infra/infra.env; set +a
      exec > >(tee -a /var/log/infra-bootstrap.log) 2>&1
      echo "=== bootstrap started $(date -Is) ==="

      # --- preflight ----------------------------------------------------------
      # This script is written by cloud-init, but the rest of the bundle is not.
      # Say so plainly instead of failing later on a missing stack file.
      for required in stacks/monitoring.yml stacks/ingress.yml stacks/admin.yml \
                      config/vmagent.yml.tpl config/alertmanager.yml.tpl \
                      config/alertmanager-none.yml config/alerts.yml \
                      autoscaler/Dockerfile admin/Dockerfile \
                      bin/component bin/stack-deploy bin/panel-hostops; do
        if [ ! -e "/opt/infra/$required" ]; then
          echo "FATAL: /opt/infra/$required is missing." >&2
          echo "The bundle was never copied to the master. Uncomment the clone line" >&2
          echo "in the cloud-config, or scp stacks/ config/ autoscaler/ admin/ bin/" >&2
          echo "into /opt/infra and re-run this script." >&2
          exit 1
        fi
      done
      chmod +x /opt/infra/bin/* 2>/dev/null || true

      # Every REPLACE_ME is checked here, before anything is installed or
      # created. Discovering a missing token after swarm init and two stack
      # deploys leaves you reconciling half a cluster by hand.
      missing=()
      # Infrastructure only. Nothing about an application is checked here
      # because nothing about an application is in this file — no image, no
      # port, no service name, no SLO. Those arrive with the component.
      for v in APP_NAME ROOT_DOMAIN HCLOUD_TOKEN HCLOUD_NETWORK_NAME \
               GHCR_USER GHCR_TOKEN CF_TUNNEL_TOKEN \
               GRAFANA_ADMIN_PASSWORD ADMIN_USER ADMIN_PASSWORD; do
        case "${!v:-}" in
          ""|REPLACE_ME*) missing+=("$v") ;;
        esac
      done
      if [ "${#missing[@]}" -gt 0 ]; then
        echo "FATAL: unset or still REPLACE_ME in /etc/infra/infra.env:" >&2
        printf '  - %s\n' "${missing[@]}" >&2
        exit 1
      fi

      # Alerting is NOT in that list. It used to be, and refusing to boot over
      # it was too blunt: you cannot always have the destination ready at the
      # moment you create the server, and a cluster you cannot bring up is worse
      # than one that tells you what is missing. So it warns here, installs a
      # receiver that visibly drops everything, and `smoke-test` fails on it
      # until you fix it. The property worth keeping was never "refuse to boot"
      # — it was "never look like it is working when it is not".
      ALERTING=0
      case "${ALERT_TELEGRAM_BOT_TOKEN:-}${ALERT_TELEGRAM_CHAT_ID:-}" in
        ""|*REPLACE_ME*) ;;
        *) ALERTING=1 ;;
      esac
      if [ "$ALERTING" = "0" ]; then
        echo "WARNING: no alert destination is configured." >&2
        echo "Alerts will be generated, grouped — and dropped. Set" >&2
        echo "ALERT_TELEGRAM_BOT_TOKEN and ALERT_TELEGRAM_CHAT_ID in" >&2
        echo "/etc/infra/infra.env and re-run: stack-deploy monitoring" >&2
      fi

      # Scaling numbers that have to agree with each other. The autoscaler
      # clamps rather than crashing, so without this the cluster would run
      # quietly on numbers you did not choose.
      : "${MIN_WORKERS:=0}" "${MAX_WORKERS:=5}"

      if [ "$MIN_WORKERS" -lt 0 ]; then
        echo "FATAL: MIN_WORKERS cannot be negative. 0 means 'no Hetzner workers'," >&2
        echo "which is the free floor — the master carries the load itself." >&2
        exit 1
      fi
      if [ "$MAX_WORKERS" -lt "$MIN_WORKERS" ]; then
        echo "FATAL: MAX_WORKERS ($MAX_WORKERS) is below MIN_WORKERS ($MIN_WORKERS)." >&2
        exit 1
      fi

      # Whether the master can hold the replica floor is measured at runtime
      # from live Swarm reservations, which this script cannot see before the
      # stacks are deployed. It is only advisory here: a master this small still
      # works, it just never returns to the free single-host state and always
      # keeps at least one worker running. The autoscaler says so in its log.
      MASTER_CPUS="$(nproc)"
      if [ "$MIN_WORKERS" -eq 0 ] && [ "$MASTER_CPUS" -lt 4 ]; then
        echo "NOTE: this master has ${MASTER_CPUS} vCPU. After the monitoring stack" >&2
        echo "and the panel reserve theirs, there may be no room left for your" >&2
        echo "components — in which case a worker always stays up and the free" >&2
        echo "floor is unreachable. Check the 'measured capacity' line in:" >&2
        echo "  docker service logs monitoring_autoscaler" >&2
      fi

      PRIVATE_IP="$(ip -4 -o addr show | awk '$4 ~ /^10\./ {print $4}' | cut -d/ -f1 | head -n1)"
      if [ -z "$PRIVATE_IP" ]; then
        echo "FATAL: no private network IP. Attach the server to a private network." >&2
        exit 1
      fi
      echo "MASTER_PRIVATE_IP=$PRIVATE_IP" >> /etc/infra/infra.env
      export MASTER_PRIVATE_IP="$PRIVATE_IP"
      echo "private ip: $PRIVATE_IP"

      # --- firewall: swarm ports must never face the internet -----------------
      ufw --force reset
      ufw default deny incoming
      ufw default allow outgoing
      ufw allow 22/tcp
      ufw allow from 10.0.0.0/8

      # Containers on this host reaching this host's own published ports, which
      # `from 10.0.0.0/8` above does NOT cover: a container's packets leave
      # through docker_gwbridge and arrive with a 172.x source, not a 10.x one.
      # Host-mode publishing installs no DNAT rule, so unlike an ingress-mode
      # port this is real INPUT traffic that ufw evaluates — and drops.
      #
      # The whole interface, deliberately, rather than a list of ports. Every
      # host-mode port here is one a container has to reach — the panel on 3000,
      # cadvisor on 8081, node-exporter on 9100, Loki on 3100 — and the
      # port-by-port version of this rule shipped covering only 3000, which left
      # vmagent unable to scrape the master at all. `up` was 0 for both of the
      # master's exporters, so the box running everything was the one box with
      # no metrics: no CPU-per-replica signal for the autoscaler, and a manager
      # whose CPU and memory read "unknown" in the panel.
      #
      # docker_gwbridge is reachable only from containers already running on
      # this host, and every one of those is ours.
      ufw allow in on docker_gwbridge

      ufw --force enable

      # --- docker -------------------------------------------------------------
      # get.docker.com is NOT used here. It runs apt behind `-qq >/dev/null`, so
      # every way this step can fail — a held dpkg lock, a package the mirror
      # does not carry — produces no error at all, and the first symptom is
      # `docker: command not found` a hundred lines later with nothing above it
      # to explain why. The install is done inline so apt's output reaches the
      # bootstrap log.

      # cloud-init's own package_upgrade and unattended-upgrades both run at
      # boot and both hold the dpkg lock. apt does not queue; it exits.
      for _ in $(seq 1 90); do
        fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break
        echo "waiting for dpkg lock to clear..."
        sleep 5
      done

      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
        -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      printf 'deb [arch=%s signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu %s stable\n' \
        "$(dpkg --print-architecture)" \
        "$(. /etc/os-release && echo "$VERSION_CODENAME")" \
        > /etc/apt/sources.list.d/docker.list
      apt-get update

      # Named explicitly, and deliberately WITHOUT docker-model-plugin, which
      # the install script adds to the same transaction. apt fails a whole
      # transaction atomically, so one package the mirror has not published yet
      # leaves the box with no docker whatsoever.
      DEBIAN_FRONTEND=noninteractive apt-get install -y \
        docker-ce docker-ce-cli containerd.io \
        docker-buildx-plugin docker-compose-plugin

      systemctl enable --now docker

      # Everything below this line assumes a working daemon. Stop here rather
      # than at `docker swarm init`, with the firewall already reconfigured and
      # half the preconditions met.
      if ! docker version >/dev/null 2>&1; then
        echo "FATAL: docker did not install, or the daemon is not running." >&2
        echo "See the apt output above, and: systemctl status docker" >&2
        exit 1
      fi

      # --- registry login, so the manager can resolve image digests ----------
      echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      # --- swarm, on the private interface ------------------------------------
      # --default-addr-pool is not optional here, and it cannot be changed after
      # init. Swarm's own default pool is 10.0.0.0/8, so `ingress` is allocated
      # 10.0.0.0/24 — and a Hetzner private network is 10.0.0.0/16, handing this
      # master 10.0.0.2 and every worker 10.0.0.3, .4, .5. The overlay subnet
      # therefore contains the host addresses of the nodes carrying it.
      #
      # Nothing complains at init. It surfaces later as workers that join the
      # swarm and then cannot be reached, which reads like a Hetzner networking
      # fault rather than an address the cluster assigned to itself. Moving
      # Docker off 10/8 entirely is the fix; 172.20/16 gives 256 overlay
      # networks, well past what this cluster can create.
      #
      # If you are re-running this on a swarm that was initialised WITHOUT the
      # flag, the pool is baked in — `docker swarm leave --force` first, then
      # re-run. That destroys the secrets too, which this script recreates.
      docker swarm init --advertise-addr "$PRIVATE_IP" --listen-addr "$PRIVATE_IP:2377" \
        --default-addr-pool 172.20.0.0/16 --default-addr-pool-mask-length 24 || true
      MASTER_ID="$(docker info -f '{{.Swarm.NodeID}}')"
      docker node update --label-add role=master "$MASTER_ID"

      docker plugin install grafana/loki-docker-driver:3.1.1 \
        --alias loki --grant-all-permissions || true

      # --- secrets -------------------------------------------------------------
      # Infrastructure credentials only. Application credentials (MONGO_URI,
      # REDIS_PASSWORD) are deliberately NOT secrets: they are plain env vars in
      # config/app-<env>.env so the admin panel can edit them. See the tradeoff
      # note in the README.
      mk_secret() { printf '%s' "$2" | docker secret create "$1" - 2>/dev/null || true; }
      mk_secret CF_TUNNEL_TOKEN           "$CF_TUNNEL_TOKEN"
      mk_secret HCLOUD_TOKEN              "$HCLOUD_TOKEN"
      mk_secret GRAFANA_ADMIN_PASSWORD    "$GRAFANA_ADMIN_PASSWORD"
      # The Telegram bot token is deliberately NOT here. It has to be optional
      # (a stack cannot reference a secret that may not exist) and editable in
      # the panel (Swarm secrets are immutable), so it is rendered into
      # config/alertmanager.yml at 0600 by bin/stack-deploy instead.
      mk_secret ADMIN_USER                "$ADMIN_USER"
      mk_secret ADMIN_PASSWORD            "$ADMIN_PASSWORD"
      # Signs admin session cookies. Generated here, never in infra.env: it is
      # not a knob, and regenerating it simply logs everyone out.
      mk_secret SESSION_SECRET            "$(openssl rand -hex 32)"

      # --- host access for the admin panel -------------------------------------
      # The panel manages the firewall, which lives on the host and is not
      # reachable through the docker socket. It gets one key, and that key's
      # authorized_keys entry FORCES bin/panel-hostops — so the panel cannot run
      # an arbitrary command as root, only the handful of verbs that script
      # implements. `restrict` also disables port/agent/X11 forwarding and PTYs.
      PANEL_KEY=/opt/infra/state/panel_ssh
      mkdir -p /opt/infra/state && chmod 700 /opt/infra/state
      if [ ! -f "$PANEL_KEY" ]; then
        ssh-keygen -t ed25519 -N "" -C "admin-panel@${APP_NAME}" -f "$PANEL_KEY" >/dev/null
      fi
      mkdir -p /root/.ssh && chmod 700 /root/.ssh
      touch /root/.ssh/authorized_keys && chmod 600 /root/.ssh/authorized_keys
      PANEL_PUB="$(cat "${PANEL_KEY}.pub")"
      if ! grep -qF "$PANEL_PUB" /root/.ssh/authorized_keys 2>/dev/null; then
        printf 'command="/opt/infra/bin/panel-hostops",restrict %s\n' "$PANEL_PUB" \
          >> /root/.ssh/authorized_keys
        echo "installed forced-command key for the admin panel"
      fi
      # Created FROM THE FILE, not through mk_secret. `$(cat key)` strips every
      # trailing newline and mk_secret's `printf '%s'` does not put one back, so
      # the secret arrived one byte short of the file — and OpenSSH rejects a
      # private key that does not end in a newline with "error in libcrypto".
      # Every host operation the panel performs (opening a database's external
      # port, reading the firewall) then failed with a key that looks perfectly
      # fine in `docker secret ls` and diffs clean against the original except
      # for its last byte. Reading the path preserves the bytes exactly.
      docker secret create PANEL_SSH_KEY "$PANEL_KEY" >/dev/null 2>&1 || true

      # --- component storage ---------------------------------------------------
      # Applications and databases live here, one directory each, created by the
      # admin panel or by `component create`. Nothing is seeded: an empty
      # cluster has no components, which is a valid and expected state.
      mkdir -p /opt/infra/components
      chmod 700 /opt/infra/components

      # --- render templates ---------------------------------------------------
      # vmagent.yml and alertmanager.yml are rendered by bin/stack-deploy, not
      # here, so that editing the alert destination in the panel and redeploying
      # monitoring actually rebuilds the config it mounts.
      cp /opt/infra/config/worker-cloud-init.yaml.tpl \
         /opt/infra/config/worker-cloud-init.yaml

      # --- build local images --------------------------------------------------
      docker build -t "${APP_NAME}/autoscaler:latest" /opt/infra/autoscaler
      docker build -t "${APP_NAME}/admin:latest"      /opt/infra/admin

      # --- networks -------------------------------------------------------------
      # `edge` is created here rather than by a stack, because every component
      # declares it external and no component may own it. When it belonged to
      # the app stack, removing that stack took the network — and therefore the
      # tunnel's route to everything else — with it.
      docker network inspect edge >/dev/null 2>&1 \
        || docker network create --driver overlay --attachable edge

      # --- monitoring first: it creates the `monitoring` network the other two
      # stacks declare external, and the autoscaler needs somewhere to read from.
      /opt/infra/bin/stack-deploy monitoring

      # --- ingress -------------------------------------------------------------
      # The tunnel connector, on its own, depending on nothing. It comes up with
      # no routes to serve and that is correct: you add a hostname in Cloudflare
      # when you create the component it points at.
      if [ -d /opt/infra/bin ]; then
        chmod +x /opt/infra/bin/*
        ln -sf /opt/infra/bin/component /usr/local/bin/component
      fi
      /opt/infra/bin/stack-deploy ingress

      # --- self-update timer ---------------------------------------------------
      # The repo is the source of truth from here on: this asks whether the
      # branch has moved and re-applies the bundle when it has. One
      # `git ls-remote` per tick, which transfers nothing when nothing changed.
      #
      # A timer rather than anything inside the panel, because an update
      # redeploys the panel — a container cannot restart itself and still be
      # around to report how it went.
      cat > /etc/systemd/system/infra-update.service <<'UNIT'
      [Unit]
      Description=Bring /opt/infra up to the infrastructure repo's newest commit
      After=network-online.target docker.service
      Wants=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/opt/infra/bin/infra-update
      # Nothing else may run while it does: a second copy mid-rebuild would race
      # two `docker stack deploy`s against the same stack. The script also takes
      # its own flock, so an operator running it by hand cannot collide either.
      TimeoutStartSec=1800
      UNIT

      cat > /etc/systemd/system/infra-update.timer <<UNIT
      [Unit]
      Description=Poll the infrastructure repo for new commits

      [Timer]
      # Not OnCalendar: OnUnitActiveSec measures from the END of the last run, so
      # a long rebuild cannot have the next tick queued up behind it.
      OnBootSec=2min
      OnUnitActiveSec=${INFRA_UPDATE_INTERVAL:-5min}
      AccuracySec=30s

      [Install]
      WantedBy=timers.target
      UNIT

      systemctl daemon-reload
      case "${INFRA_REPO_URL:-}" in
        ""|*REPLACE_ME*)
          echo "INFRA_REPO_URL is not set — self-update is OFF for this cluster." >&2
          echo "Infrastructure changes will have to be copied to /opt/infra by hand." >&2
          ;;
        *)
          systemctl enable --now infra-update.timer
          echo "self-update every ${INFRA_UPDATE_INTERVAL:-5min} from ${INFRA_REPO_BRANCH:-master}"
          ;;
      esac

      # --- optional deploy user, so CI never needs root -----------------------
      if [ -n "${CI_SSH_PUBLIC_KEY:-}" ]; then
        id -u deploy >/dev/null 2>&1 || useradd -m -s /bin/bash deploy
        usermod -aG docker deploy
        mkdir -p /home/deploy/.ssh && chmod 700 /home/deploy/.ssh
        printf '%s\n' "$CI_SSH_PUBLIC_KEY" > /home/deploy/.ssh/authorized_keys
        chmod 600 /home/deploy/.ssh/authorized_keys
        chown -R deploy:deploy /home/deploy/.ssh
        echo "deploy user ready"
      else
        echo "CI_SSH_PUBLIC_KEY empty — skipping deploy user"
      fi

      # --- admin panel ---------------------------------------------------------
      # Deployed last: it is the console for a cluster that must already be up.
      # It is the ONLY thing here with both the docker socket and a login form,
      # so it is deliberately the smallest surface we can get away with.
      envsubst < /opt/infra/stacks/admin.yml | docker stack deploy -c - admin

      echo "=== bootstrap finished $(date -Is) ==="
      echo
      echo "Workers do not exist yet — the autoscaler creates the first one on"
      echo "its first loop. Watch:  docker service logs -f monitoring_autoscaler"
      echo
      echo "Cloudflare tunnel hostnames to add now (ONE tunnel):"
      echo "  grafana-${APP_NAME}.${ROOT_DOMAIN}  -> http://grafana:3000"
      echo "  admin-${APP_NAME}.${ROOT_DOMAIN}    -> http://${PRIVATE_IP}:3000"
      echo
      echo "Put both behind Cloudflare Access. The admin panel holds the docker"
      echo "socket and can redeploy anything — its password is the cluster."
      echo "Access in front of it is your second factor."
      echo
      echo "There are no applications yet, on purpose. Create one in the panel"
      echo "(Components -> New app), or on this box:"
      echo "  component create app api --image ghcr.io/you/app:tag --port 8080"
      echo "Then add its hostname in Cloudflare, pointing at the local target"
      echo "the panel shows you."

runcmd:
  - [ bash, -lc, "mkdir -p /opt/infra" ]
  - [ bash, -lc, "git clone --depth 1 https://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@github.com/dhng22/hetzner-infra.git /tmp/i && rm -rf /tmp/i/.git && cp -a /tmp/i/. /opt/infra/ && rm -rf /tmp/i" ]
  - [ bash, -lc, "/opt/infra/bootstrap.sh" ]

final_message: "Master ready after $UPTIME seconds. See /var/log/infra-bootstrap.log"