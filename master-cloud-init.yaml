#cloud-config
# =============================================================================
# MASTER NODE CLOUD-INIT  —  paste this into Hetzner "Cloud config" on create
# =============================================================================
# EDIT ONLY THE BLOCK MARKED "VARIABLES". Everything below it is generic.
#
# Server: CPX31 (4 vCPU / 8 GB). The master runs the admin panel, both Redis
# instances, VictoriaMetrics, Loki, Grafana and the autoscaler. It runs
# NO application tasks and NO cloudflared — ingress lives entirely on the
# workers, so losing this box costs you monitoring and scaling, not uptime.
#
# Attach the server to a Hetzner private network BEFORE creating it.
# =============================================================================

package_update: true
package_upgrade: true

packages:
  - curl
  - jq
  - git
  - ufw
  - unzip
  - gettext-base
  - ca-certificates
  - gnupg

write_files:
  # ---------------------------------------------------------------------------
  # VARIABLES  — the only section you need to touch
  # ---------------------------------------------------------------------------
  - path: /etc/infra/infra.env
    permissions: "0600"
    owner: root:root
    content: |
      # --- identity -----------------------------------------------------------
      # APP_NAME does three jobs: the Hetzner label namespace the autoscaler is
      # allowed to touch, the worker hostname prefix, and the third-level
      # domain. If you run anything else in this Hetzner project, that label is
      # the only thing stopping the autoscaler from deleting it.
      APP_NAME=aichat
      ROOT_DOMAIN=mydomain.com

      # Cloudflare's free Universal SSL certificate covers *.mydomain.com and
      # nothing deeper, so every hostname stays at the third level and extra
      # services are separated by a dash rather than another dot:
      #   aichat.mydomain.com           production
      #   staging-aichat.mydomain.com   staging
      #   grafana-aichat.mydomain.com   dashboards
      #   admin-aichat.mydomain.com     admin panel

      # --- Hetzner ------------------------------------------------------------
      HCLOUD_TOKEN=REPLACE_ME
      HCLOUD_LOCATION=hel1
      HCLOUD_NETWORK_NAME=prod-net
      HCLOUD_SSH_KEY_NAME=my-laptop
      WORKER_IMAGE=ubuntu-24.04
      WORKER_TYPE=cpx21              # shared worker pool

      # --- container registry: FIRST BOOT ONLY --------------------------------
      # Used once, for the initial `docker login` so the very first deploy can
      # pull. After that the panel owns registry auth (Apps > API > Deployments),
      # which is per-registry and can be changed without touching this file.
      GHCR_USER=your-github-username
      GHCR_TOKEN=REPLACE_ME          # PAT with read:packages

      # --- Cloudflare: ONE tunnel, two public hostnames -----------------------
      # In Zero Trust, add both hostnames to the same tunnel:
      #   ${APP_NAME}.${ROOT_DOMAIN}          -> http://api-prod:8080
      #   staging-${APP_NAME}.${ROOT_DOMAIN}  -> http://api-staging:8080
      CF_TUNNEL_TOKEN=REPLACE_ME

      # --- FIRST BOOT ONLY ------------------------------------------------------
      # The four values below are copied into config/app-<env>.env once, so that
      # this file stays the only thing you fill in to stand the cluster up.
      # After that they are dead: the panel owns them and these copies go stale.
      # They are hidden in Settings for exactly that reason.
      #
      #   Mongo URI       -> Apps > API > <env> > Environment
      #   Redis password  -> Apps > Redis > <env> > Credentials
      #
      # Changing them here later does nothing — an existing app-<env>.env always
      # wins, so a re-run of bootstrap cannot clobber what you set in the panel.

      # MongoDB Atlas: separate databases per environment.
      MONGO_URI_PROD=mongodb+srv://user:pass@cluster.mongodb.net/appdb?retryWrites=true&w=majority
      MONGO_URI_STAGING=mongodb+srv://user:pass@cluster.mongodb.net/appdb_staging?retryWrites=true&w=majority

      # Redis. One value per environment, enforced by the server and used by the
      # API and the exporter — the panel keeps all three in step.
      REDIS_PASSWORD_PROD=REPLACE_ME_LONG_RANDOM
      REDIS_PASSWORD_STAGING=REPLACE_ME_LONG_RANDOM

      # --- Grafana ------------------------------------------------------------
      GRAFANA_ADMIN_USER=admin
      GRAFANA_ADMIN_PASSWORD=REPLACE_ME_LONG_RANDOM

      # --- Admin panel --------------------------------------------------------
      # The web console at admin-${APP_NAME}.${ROOT_DOMAIN}. It can redeploy
      # production and read every application credential, so this password is
      # the key to the cluster: make it long and unique, and put the hostname
      # behind Cloudflare Access as a second factor.
      ADMIN_USER=admin
      ADMIN_PASSWORD=REPLACE_ME_LONG_RANDOM

      # --- Alerting -----------------------------------------------------------
      # Where alerts actually land. A Slack incoming webhook, or a Discord
      # webhook with /slack appended. Bootstrap REFUSES to start without it.
      # That is deliberate: an alerting stack that generates, groups, dispatches
      # and then discards everything is worse than having none, because it looks
      # like it is working right up until the moment you needed it.
      ALERT_WEBHOOK_URL=REPLACE_ME

      # --- first image: FIRST BOOT ONLY ---------------------------------------
      # What the services are created with. From the next deploy onward CI owns
      # the image and bin/app-env pins whatever is live, so these are never read
      # again — unless a service is deleted and recreated, when they decide what
      # it comes back as. The panel shows the LIVE image on the API page; it does
      # not show these, because they stop being true within a day.
      #
      # Use an immutable tag. A moving tag like :prod-latest works here (nothing
      # exists yet, so there is nothing to no-op against), but a recreated
      # service would silently come back on whatever is newest rather than the
      # build you last tested.
      APP_IMAGE_PROD=ghcr.io/you/your-ktor-app:prod-abc1234
      APP_IMAGE_STAGING=ghcr.io/you/your-ktor-app:staging-abc1234
      APP_PORT=8080
      APP_METRICS_PATH=/metrics

      # --- deploy access (OPTIONAL) -------------------------------------------
      # Your app's CI is your business, but whatever you build needs a way in
      # that is not root. Put a public key here and this script creates a
      # `deploy` user in the docker group with that key installed. Its CI then
      # runs one command:
      #   docker service update --with-registry-auth --image <img> app_api-prod
      # Leave blank to skip entirely and deploy however you prefer.
      CI_SSH_PUBLIC_KEY=

      # --- Autoscaler ---------------------------------------------------------
      APP_SERVICE=app_api-prod
      APP_CPU_LIMIT=1.0              # MUST match the limit in stacks/app.yml

      # THE number. Everything else is derived from it. Set it to the p95 your
      # users should never see exceeded, then leave it alone.
      SLO_P95_MS=500
      SCALE_UP_P95_RATIO=0.8         # act at 80% of SLO, before users feel it
      SCALE_DOWN_P95_RATIO=0.4

      # Secondary signal: CPU of ONE replica against its own limit. Needed
      # because p95 is undefined when traffic is near zero — CPU is what tells
      # the scaler it is safe to come back down.
      SCALE_UP_CPU=70
      SCALE_DOWN_CPU=30

      # Placement guard, not a trigger: if a worker is this loaded on CPU or
      # memory, another replica physically will not fit, so ask for a node.
      NODE_PRESSURE_PCT=80

      # Two is the production floor: with one replica a crash is an outage and
      # a rolling update has nowhere to shift traffic. This is also the count
      # used on first deploy — the autoscaler owns it from then on.
      MIN_REPLICAS=2
      MAX_REPLICAS=12
      REPLICAS_PER_WORKER=2          # CPX21 = 3 vCPU; 2 x 1.0 leaves headroom
      MIN_WORKERS=1
      MAX_WORKERS=6                  # a BUDGET cap, not a capacity plan

      # Up fast, down slow. Never make these symmetric.
      SUSTAIN_UP_SECONDS=90
      SUSTAIN_DOWN_SECONDS=900
      SCALE_UP_FACTOR=0.5            # +50% of current, minimum +1
      REPLICA_COOLDOWN_SECONDS=60
      # Must exceed node boot + image pull + JVM warmup or you will overshoot.
      COOLDOWN_UP_SECONDS=300
      COOLDOWN_DOWN_SECONDS=900

      SCHEDULE_FLOOR=08:00-20:00=2   # UTC; "HH:MM-HH:MM=N" comma separated
      DRY_RUN=false

  # ---------------------------------------------------------------------------
  - path: /opt/infra/bootstrap.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      set -a; source /etc/infra/infra.env; set +a
      exec > >(tee -a /var/log/infra-bootstrap.log) 2>&1
      echo "=== bootstrap started $(date -Is) ==="

      # --- preflight ----------------------------------------------------------
      # This script is written by cloud-init, but the rest of the bundle is not.
      # Say so plainly instead of failing later on a missing stack file.
      for required in stacks/app.yml stacks/monitoring.yml stacks/admin.yml \
                      config/vmagent.yml.tpl autoscaler/Dockerfile admin/Dockerfile \
                      bin/app-env bin/stack-deploy bin/panel-hostops; do
        if [ ! -e "/opt/infra/$required" ]; then
          echo "FATAL: /opt/infra/$required is missing." >&2
          echo "The bundle was never copied to the master. Uncomment the clone line" >&2
          echo "in the cloud-config, or scp stacks/ config/ autoscaler/ admin/ bin/" >&2
          echo "into /opt/infra and re-run this script." >&2
          exit 1
        fi
      done
      chmod +x /opt/infra/bin/* 2>/dev/null || true

      # Every REPLACE_ME is checked here, before anything is installed or
      # created. Discovering a missing token after swarm init and two stack
      # deploys leaves you reconciling half a cluster by hand.
      missing=()
      for v in APP_NAME ROOT_DOMAIN HCLOUD_TOKEN HCLOUD_NETWORK_NAME \
               GHCR_USER GHCR_TOKEN CF_TUNNEL_TOKEN \
               MONGO_URI_PROD MONGO_URI_STAGING \
               REDIS_PASSWORD_PROD REDIS_PASSWORD_STAGING \
               GRAFANA_ADMIN_PASSWORD ALERT_WEBHOOK_URL \
               ADMIN_USER ADMIN_PASSWORD \
               APP_IMAGE_PROD APP_IMAGE_STAGING APP_SERVICE APP_CPU_LIMIT; do
        case "${!v:-}" in
          ""|REPLACE_ME*) missing+=("$v") ;;
        esac
      done
      if [ "${#missing[@]}" -gt 0 ]; then
        echo "FATAL: unset or still REPLACE_ME in /etc/infra/infra.env:" >&2
        printf '  - %s\n' "${missing[@]}" >&2
        exit 1
      fi

      PRIVATE_IP="$(ip -4 -o addr show | awk '$4 ~ /^10\./ {print $4}' | cut -d/ -f1 | head -n1)"
      if [ -z "$PRIVATE_IP" ]; then
        echo "FATAL: no private network IP. Attach the server to a private network." >&2
        exit 1
      fi
      echo "MASTER_PRIVATE_IP=$PRIVATE_IP" >> /etc/infra/infra.env
      export MASTER_PRIVATE_IP="$PRIVATE_IP"
      echo "private ip: $PRIVATE_IP"

      # --- firewall: swarm ports must never face the internet -----------------
      ufw --force reset
      ufw default deny incoming
      ufw default allow outgoing
      ufw allow 22/tcp
      ufw allow from 10.0.0.0/8
      ufw --force enable

      # --- docker -------------------------------------------------------------
      curl -fsSL https://get.docker.com | sh
      systemctl enable --now docker

      # --- registry login, so the manager can resolve image digests ----------
      echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      # --- swarm, on the private interface ------------------------------------
      docker swarm init --advertise-addr "$PRIVATE_IP" --listen-addr "$PRIVATE_IP:2377" || true
      MASTER_ID="$(docker info -f '{{.Swarm.NodeID}}')"
      docker node update --label-add role=master "$MASTER_ID"

      docker plugin install grafana/loki-docker-driver:3.1.1 \
        --alias loki --grant-all-permissions || true

      # --- secrets -------------------------------------------------------------
      # Infrastructure credentials only. Application credentials (MONGO_URI,
      # REDIS_PASSWORD) are deliberately NOT secrets: they are plain env vars in
      # config/app-<env>.env so the admin panel can edit them. See the tradeoff
      # note in the README.
      mk_secret() { printf '%s' "$2" | docker secret create "$1" - 2>/dev/null || true; }
      mk_secret CF_TUNNEL_TOKEN           "$CF_TUNNEL_TOKEN"
      mk_secret HCLOUD_TOKEN              "$HCLOUD_TOKEN"
      mk_secret GRAFANA_ADMIN_PASSWORD    "$GRAFANA_ADMIN_PASSWORD"
      mk_secret ALERT_WEBHOOK_URL         "$ALERT_WEBHOOK_URL"
      mk_secret ADMIN_USER                "$ADMIN_USER"
      mk_secret ADMIN_PASSWORD            "$ADMIN_PASSWORD"
      # Signs admin session cookies. Generated here, never in infra.env: it is
      # not a knob, and regenerating it simply logs everyone out.
      mk_secret SESSION_SECRET            "$(openssl rand -hex 32)"

      # --- host access for the admin panel -------------------------------------
      # The panel manages the firewall, which lives on the host and is not
      # reachable through the docker socket. It gets one key, and that key's
      # authorized_keys entry FORCES bin/panel-hostops — so the panel cannot run
      # an arbitrary command as root, only the handful of verbs that script
      # implements. `restrict` also disables port/agent/X11 forwarding and PTYs.
      PANEL_KEY=/opt/infra/state/panel_ssh
      mkdir -p /opt/infra/state && chmod 700 /opt/infra/state
      if [ ! -f "$PANEL_KEY" ]; then
        ssh-keygen -t ed25519 -N "" -C "admin-panel@${APP_NAME}" -f "$PANEL_KEY" >/dev/null
      fi
      mkdir -p /root/.ssh && chmod 700 /root/.ssh
      touch /root/.ssh/authorized_keys && chmod 600 /root/.ssh/authorized_keys
      PANEL_PUB="$(cat "${PANEL_KEY}.pub")"
      if ! grep -qF "$PANEL_PUB" /root/.ssh/authorized_keys 2>/dev/null; then
        printf 'command="/opt/infra/bin/panel-hostops",restrict %s\n' "$PANEL_PUB" \
          >> /root/.ssh/authorized_keys
        echo "installed forced-command key for the admin panel"
      fi
      mk_secret PANEL_SSH_KEY "$(cat "$PANEL_KEY")"

      # --- seed application config from infra.env ------------------------------
      # Keeps master-cloud-init.yaml the only file you fill in. Written once; on
      # later boots the existing file wins, so edits made in the admin panel are
      # never clobbered by a re-run.
      seed_env() {
        local file="/opt/infra/config/app-$1.env"
        if [ -s "$file" ] && grep -q '^MONGO_URI=' "$file"; then
          echo "keeping existing $file"
          return
        fi
        {
          echo "# $1 application configuration."
          echo "# Seeded from /etc/infra/infra.env at first boot."
          echo "# Edit in the admin panel (Apps -> API -> $1 -> Environment),"
          echo "# or with: app-env set KEY=VALUE $1"
          echo
          printf 'MONGO_URI=%s\n' "$2"
          printf 'REDIS_PASSWORD=%s\n' "$3"
          printf 'LOG_LEVEL=%s\n' "$4"
        } > "$file"
        chmod 600 "$file"
        echo "seeded $file"
      }
      seed_env prod    "$MONGO_URI_PROD"    "$REDIS_PASSWORD_PROD"    INFO
      seed_env staging "$MONGO_URI_STAGING" "$REDIS_PASSWORD_STAGING" DEBUG

      # --- render templates ---------------------------------------------------
      envsubst < /opt/infra/config/vmagent.yml.tpl > /opt/infra/config/vmagent.yml
      cp /opt/infra/config/worker-cloud-init.yaml.tpl \
         /opt/infra/config/worker-cloud-init.yaml

      # --- build local images --------------------------------------------------
      docker build -t "${APP_NAME}/autoscaler:latest" /opt/infra/autoscaler
      docker build -t "${APP_NAME}/admin:latest"      /opt/infra/admin

      # --- monitoring first: the autoscalers need somewhere to read from -----
      docker stack deploy -c /opt/infra/stacks/monitoring.yml monitoring

      # --- one stack, both environments, one tunnel --------------------------
      # Deployed through bin/app-env so there is exactly ONE deploy path in the
      # system. It layers config/app-*.env over the stack file, and on every
      # run after this one it pins the live replica count and CI's deployed
      # image so a redeploy cannot undo the autoscaler or roll production back.
      # Nothing is live yet here, so it falls back to infra.env.
      # It passes --with-registry-auth, which ships the GHCR credential with the
      # service spec so a worker created an hour from now can still pull.
      if [ -d /opt/infra/bin ]; then
        chmod +x /opt/infra/bin/*
        ln -sf /opt/infra/bin/app-env /usr/local/bin/app-env
      fi
      touch /opt/infra/config/app-prod.env /opt/infra/config/app-staging.env
      /opt/infra/bin/app-env deploy

      # --- optional deploy user, so CI never needs root -----------------------
      if [ -n "${CI_SSH_PUBLIC_KEY:-}" ]; then
        id -u deploy >/dev/null 2>&1 || useradd -m -s /bin/bash deploy
        usermod -aG docker deploy
        mkdir -p /home/deploy/.ssh && chmod 700 /home/deploy/.ssh
        printf '%s\n' "$CI_SSH_PUBLIC_KEY" > /home/deploy/.ssh/authorized_keys
        chmod 600 /home/deploy/.ssh/authorized_keys
        chown -R deploy:deploy /home/deploy/.ssh
        echo "deploy user ready"
      else
        echo "CI_SSH_PUBLIC_KEY empty — skipping deploy user"
      fi

      # --- admin panel ---------------------------------------------------------
      # Deployed last: it is the console for a cluster that must already be up.
      # It is the ONLY thing here with both the docker socket and a login form,
      # so it is deliberately the smallest surface we can get away with.
      envsubst < /opt/infra/stacks/admin.yml | docker stack deploy -c - admin

      echo "=== bootstrap finished $(date -Is) ==="
      echo
      echo "Workers do not exist yet — the autoscaler creates the first one on"
      echo "its first loop. Watch:  docker service logs -f monitoring_autoscaler"
      echo
      echo "Cloudflare tunnel public hostnames (ONE tunnel, four hostnames):"
      echo "  ${APP_NAME}.${ROOT_DOMAIN}          -> http://api-prod:${APP_PORT}"
      echo "  staging-${APP_NAME}.${ROOT_DOMAIN}  -> http://api-staging:${APP_PORT}"
      echo "  grafana-${APP_NAME}.${ROOT_DOMAIN}  -> http://grafana:3000"
      echo "  admin-${APP_NAME}.${ROOT_DOMAIN}    -> http://${PRIVATE_IP}:3000"
      echo
      echo "Put the last two behind Cloudflare Access. The admin panel holds the"
      echo "docker socket and can redeploy production — its password is the"
      echo "cluster. Access in front of it is your second factor."

runcmd:
  - [ bash, -lc, "mkdir -p /opt/infra" ]
  - [ bash, -lc, "git clone --depth 1 https://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@github.com/you/infra.git /tmp/i && rm -rf /tmp/i/.git && cp -a /tmp/i/. /opt/infra/ && rm -rf /tmp/i" ]
  #
  # ...or leave both commented, scp the bundle to /opt/infra yourself, and run
  # /opt/infra/bootstrap.sh by hand. No token ever touches the server.
  #
  - [ bash, -lc, "/opt/infra/bootstrap.sh" ]

final_message: "Master ready after $UPTIME seconds. See /var/log/infra-bootstrap.log"