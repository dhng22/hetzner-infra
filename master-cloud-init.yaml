#cloud-config
# =============================================================================
# MASTER NODE CLOUD-INIT  —  paste this into Hetzner "Cloud config" on create
# =============================================================================
# EDIT ONLY THE BLOCK MARKED "VARIABLES". Everything below it is generic.
#
# Server: CPX31 (4 vCPU / 8 GB). The master runs Dokploy, both Redis
# instances, VictoriaMetrics, Loki, Grafana and the autoscaler. It runs
# NO application tasks and NO cloudflared — ingress lives entirely on the
# workers, so losing this box costs you monitoring and scaling, not uptime.
#
# Attach the server to a Hetzner private network BEFORE creating it.
# =============================================================================

package_update: true
package_upgrade: true

packages:
  - curl
  - jq
  - git
  - ufw
  - unzip
  - gettext-base
  - ca-certificates
  - gnupg

write_files:
  # ---------------------------------------------------------------------------
  # VARIABLES  — the only section you need to touch
  # ---------------------------------------------------------------------------
  - path: /etc/infra/infra.env
    permissions: "0600"
    owner: root:root
    content: |
      # --- identity -----------------------------------------------------------
      # APP_NAME does three jobs: the Hetzner label namespace the autoscaler is
      # allowed to touch, the worker hostname prefix, and the third-level
      # domain. If you run anything else in this Hetzner project, that label is
      # the only thing stopping the autoscaler from deleting it.
      APP_NAME=aichat
      ROOT_DOMAIN=mydomain.com

      # Cloudflare's free Universal SSL certificate covers *.mydomain.com and
      # nothing deeper, so every hostname stays at the third level and extra
      # services are separated by a dash rather than another dot:
      #   aichat.mydomain.com           production
      #   staging-aichat.mydomain.com   staging
      #   grafana-aichat.mydomain.com   dashboards
      #   dokploy-aichat.mydomain.com   Dokploy UI

      # --- Hetzner ------------------------------------------------------------
      HCLOUD_TOKEN=REPLACE_ME
      HCLOUD_LOCATION=hel1
      HCLOUD_NETWORK_NAME=prod-net
      HCLOUD_SSH_KEY_NAME=my-laptop
      WORKER_IMAGE=ubuntu-24.04
      WORKER_TYPE=cpx21              # shared worker pool

      # --- container registry (GitHub Actions builds, GHCR hosts) -------------
      GHCR_USER=your-github-username
      GHCR_TOKEN=REPLACE_ME          # PAT with read:packages

      # --- Cloudflare: ONE tunnel, two public hostnames -----------------------
      # In Zero Trust, add both hostnames to the same tunnel:
      #   ${APP_NAME}.${ROOT_DOMAIN}          -> http://api-prod:8080
      #   staging-${APP_NAME}.${ROOT_DOMAIN}  -> http://api-staging:8080
      CF_TUNNEL_TOKEN=REPLACE_ME

      # --- MongoDB Atlas: separate databases per environment -----------------
      MONGO_URI_PROD=mongodb+srv://user:pass@cluster.mongodb.net/appdb?retryWrites=true&w=majority
      MONGO_URI_STAGING=mongodb+srv://user:pass@cluster.mongodb.net/appdb_staging?retryWrites=true&w=majority

      # --- Redis --------------------------------------------------------------
      REDIS_PASSWORD_PROD=REPLACE_ME_LONG_RANDOM
      REDIS_PASSWORD_STAGING=REPLACE_ME_LONG_RANDOM

      # --- Grafana ------------------------------------------------------------
      GRAFANA_ADMIN_USER=admin
      GRAFANA_ADMIN_PASSWORD=REPLACE_ME_LONG_RANDOM

      # --- Application images -------------------------------------------------
      # Pin production to an immutable tag. NEVER :latest — Swarm compares the
      # reference string and silently no-ops the deploy if it is unchanged.
      # Only the FIRST deploy uses these. After that, CI sets the image with
      # docker service update, and the autoscaler owns the replica count.
      APP_IMAGE_PROD=ghcr.io/you/your-ktor-app:sha-abc1234
      APP_IMAGE_STAGING=ghcr.io/you/your-ktor-app:sha-abc1234
      APP_PORT=8080
      APP_METRICS_PATH=/metrics

      # --- deploy access (OPTIONAL) -------------------------------------------
      # Your app's CI is your business, but whatever you build needs a way in
      # that is not root. Put a public key here and this script creates a
      # `deploy` user in the docker group with that key installed. Its CI then
      # runs one command:
      #   docker service update --with-registry-auth --image <img> app_api-prod
      # Leave blank to skip entirely and deploy however you prefer.
      CI_SSH_PUBLIC_KEY=

      # --- Autoscaler ---------------------------------------------------------
      APP_SERVICE=app_api-prod
      APP_CPU_LIMIT=1.0              # MUST match the limit in stacks/app.yml

      # THE number. Everything else is derived from it. Set it to the p95 your
      # users should never see exceeded, then leave it alone.
      SLO_P95_MS=500
      SCALE_UP_P95_RATIO=0.8         # act at 80% of SLO, before users feel it
      SCALE_DOWN_P95_RATIO=0.4

      # Secondary signal: CPU of ONE replica against its own limit. Needed
      # because p95 is undefined when traffic is near zero — CPU is what tells
      # the scaler it is safe to come back down.
      SCALE_UP_CPU=70
      SCALE_DOWN_CPU=30

      # Placement guard, not a trigger: if a worker is this loaded on CPU or
      # memory, another replica physically will not fit, so ask for a node.
      NODE_PRESSURE_PCT=80

      # Two is the production floor: with one replica a crash is an outage and
      # a rolling update has nowhere to shift traffic. This is also the count
      # used on first deploy — the autoscaler owns it from then on.
      MIN_REPLICAS=2
      MAX_REPLICAS=12
      REPLICAS_PER_WORKER=2          # CPX21 = 3 vCPU; 2 x 1.0 leaves headroom
      MIN_WORKERS=1
      MAX_WORKERS=6                  # a BUDGET cap, not a capacity plan

      # Up fast, down slow. Never make these symmetric.
      SUSTAIN_UP_SECONDS=90
      SUSTAIN_DOWN_SECONDS=900
      SCALE_UP_FACTOR=0.5            # +50% of current, minimum +1
      REPLICA_COOLDOWN_SECONDS=60
      # Must exceed node boot + image pull + JVM warmup or you will overshoot.
      COOLDOWN_UP_SECONDS=300
      COOLDOWN_DOWN_SECONDS=900

      SCHEDULE_FLOOR=08:00-20:00=2   # UTC; "HH:MM-HH:MM=N" comma separated
      DRY_RUN=false

  # ---------------------------------------------------------------------------
  - path: /opt/infra/bootstrap.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      set -a; source /etc/infra/infra.env; set +a
      exec > >(tee -a /var/log/infra-bootstrap.log) 2>&1
      echo "=== bootstrap started $(date -Is) ==="

      PRIVATE_IP="$(ip -4 -o addr show | awk '$4 ~ /^10\./ {print $4}' | cut -d/ -f1 | head -n1)"
      if [ -z "$PRIVATE_IP" ]; then
        echo "FATAL: no private network IP. Attach the server to a private network." >&2
        exit 1
      fi
      echo "MASTER_PRIVATE_IP=$PRIVATE_IP" >> /etc/infra/infra.env
      export MASTER_PRIVATE_IP="$PRIVATE_IP"
      echo "private ip: $PRIVATE_IP"

      # --- firewall: swarm ports must never face the internet -----------------
      ufw --force reset
      ufw default deny incoming
      ufw default allow outgoing
      ufw allow 22/tcp
      ufw allow from 10.0.0.0/8
      ufw --force enable

      # --- docker -------------------------------------------------------------
      curl -fsSL https://get.docker.com | sh
      systemctl enable --now docker

      # --- registry login, so the manager can resolve image digests ----------
      echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      # --- swarm, on the private interface ------------------------------------
      docker swarm init --advertise-addr "$PRIVATE_IP" --listen-addr "$PRIVATE_IP:2377" || true
      MASTER_ID="$(docker info -f '{{.Swarm.NodeID}}')"
      docker node update --label-add role=master "$MASTER_ID"

      docker plugin install grafana/loki-docker-driver:3.1.1 \
        --alias loki --grant-all-permissions || true

      # --- secrets, one set per environment -----------------------------------
      mk_secret() { printf '%s' "$2" | docker secret create "$1" - 2>/dev/null || true; }
      mk_secret MONGO_URI_prod            "$MONGO_URI_PROD"
      mk_secret MONGO_URI_staging         "$MONGO_URI_STAGING"
      mk_secret REDIS_PASSWORD_prod       "$REDIS_PASSWORD_PROD"
      mk_secret REDIS_PASSWORD_staging    "$REDIS_PASSWORD_STAGING"
      mk_secret CF_TUNNEL_TOKEN           "$CF_TUNNEL_TOKEN"
      mk_secret HCLOUD_TOKEN              "$HCLOUD_TOKEN"
      mk_secret GRAFANA_ADMIN_PASSWORD    "$GRAFANA_ADMIN_PASSWORD"

      # --- render templates ---------------------------------------------------
      envsubst < /opt/infra/config/vmagent.yml.tpl > /opt/infra/config/vmagent.yml
      cp /opt/infra/config/worker-cloud-init.yaml.tpl \
         /opt/infra/config/worker-cloud-init.yaml

      # --- build the autoscaler image ----------------------------------------
      docker build -t "${APP_NAME}/autoscaler:latest" /opt/infra/autoscaler

      # --- monitoring first: the autoscalers need somewhere to read from -----
      docker stack deploy -c /opt/infra/stacks/monitoring.yml monitoring

      # --- one stack, both environments, one tunnel --------------------------
      # --with-registry-auth ships the GHCR credential with the service spec so
      # a worker created an hour from now can still pull the image.
      envsubst < /opt/infra/stacks/app.yml \
        | docker stack deploy --with-registry-auth -c - app

      # --- optional deploy user, so CI never needs root -----------------------
      if [ -n "${CI_SSH_PUBLIC_KEY:-}" ]; then
        id -u deploy >/dev/null 2>&1 || useradd -m -s /bin/bash deploy
        usermod -aG docker deploy
        mkdir -p /home/deploy/.ssh && chmod 700 /home/deploy/.ssh
        printf '%s\n' "$CI_SSH_PUBLIC_KEY" > /home/deploy/.ssh/authorized_keys
        chmod 600 /home/deploy/.ssh/authorized_keys
        chown -R deploy:deploy /home/deploy/.ssh
        echo "deploy user ready"
      else
        echo "CI_SSH_PUBLIC_KEY empty — skipping deploy user"
      fi

      echo "=== bootstrap finished $(date -Is) ==="
      echo
      echo "Workers do not exist yet — the autoscaler creates the first one on"
      echo "its first loop. Watch:  docker service logs -f monitoring_autoscaler"
      echo
      echo "Cloudflare tunnel public hostnames (ONE tunnel, four hostnames):"
      echo "  ${APP_NAME}.${ROOT_DOMAIN}          -> http://api-prod:${APP_PORT}"
      echo "  staging-${APP_NAME}.${ROOT_DOMAIN}  -> http://api-staging:${APP_PORT}"
      echo "  grafana-${APP_NAME}.${ROOT_DOMAIN}  -> http://grafana:3000"
      echo "  dokploy-${APP_NAME}.${ROOT_DOMAIN}  -> http://${PRIVATE_IP}:3000"
      echo
      echo "Put the last two behind Cloudflare Access. They are your cluster."

runcmd:
  - [ bash, -lc, "mkdir -p /opt/infra" ]
  # Put the bundle on the box. Either clone your private repo here:
  # - [ bash, -lc, "git clone https://TOKEN@github.com/you/infra.git /tmp/i && cp -r /tmp/i/* /opt/infra/" ]
  # ...or scp stacks/ config/ autoscaler/ into /opt/infra and run bootstrap by hand.
  - [ bash, -lc, "/opt/infra/bootstrap.sh" ]

final_message: "Master ready after $UPTIME seconds. See /var/log/infra-bootstrap.log"