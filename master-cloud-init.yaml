#cloud-config
# =============================================================================
# MASTER NODE CLOUD-INIT — paste into Hetzner "Cloud config" on create.
#
# EDIT ONLY THE VARIABLES BLOCK. Everything else is generic, and every scaling,
# database and alerting knob ships with a working default you change afterwards
# in the panel (Manager > Fleet / Databases) rather than here.
#
# CPX31 (4 vCPU / 8 GB). The master runs the panel, both Redis instances,
# VictoriaMetrics, Loki, Grafana and the autoscaler. It runs NO application
# tasks and NO cloudflared — ingress lives on the workers, so losing this box
# costs you monitoring and scaling, not uptime.
#
# Attach the server to a Hetzner private network BEFORE creating it.
# =============================================================================

package_update: true
package_upgrade: true

packages:
  - curl
  - jq
  - git
  - ufw
  - unzip
  - gettext-base
  - ca-certificates
  - gnupg
  # bin/component renders component stacks on the host, outside the panel's
  # container, and Ubuntu's python3 does not ship PyYAML.
  - python3-yaml

write_files:
  # ---------------------------------------------------------------------------
  # VARIABLES — the only section you need to touch
  # ---------------------------------------------------------------------------
  - path: /etc/infra/infra.env
    permissions: "0600"
    owner: root:root
    content: |
      # --- identity -----------------------------------------------------------
      # APP_NAME is the Hetzner label namespace the autoscaler is allowed to
      # touch, the worker hostname prefix and the third-level domain. If you run
      # anything else in this Hetzner project, that label is the only thing
      # stopping the autoscaler from deleting it.
      APP_NAME=aichat
      ROOT_DOMAIN=mydomain.com

      # Cloudflare's free Universal SSL covers *.mydomain.com and nothing
      # deeper, so every hostname stays at the third level and extra services
      # are separated by a dash rather than another dot:
      #   aichat.mydomain.com / staging-aichat.mydomain.com / admin-aichat...

      # --- Hetzner ------------------------------------------------------------
      HCLOUD_TOKEN=REPLACE_ME
      HCLOUD_LOCATION=hel1
      HCLOUD_NETWORK_NAME=prod-net
      HCLOUD_SSH_KEY_NAME=my-laptop
      WORKER_IMAGE=ubuntu-24.04

      # --- container registry: FIRST BOOT ONLY --------------------------------
      # One `docker login` so the very first deploy can pull. After that the
      # panel owns registry auth (Apps > API > Deployments), per registry.
      GHCR_USER=your-github-username
      GHCR_TOKEN=REPLACE_ME          # PAT with read:packages

      # --- Cloudflare: ONE tunnel, two public hostnames -----------------------
      # In Zero Trust, add both hostnames to the same tunnel:
      #   ${APP_NAME}.${ROOT_DOMAIN}          -> http://api-prod:8080
      #   staging-${APP_NAME}.${ROOT_DOMAIN}  -> http://api-staging:8080
      CF_TUNNEL_TOKEN=REPLACE_ME

      # --- Admin panel --------------------------------------------------------
      # The web console at admin-${APP_NAME}.${ROOT_DOMAIN}. It can deploy
      # anything in the cluster and read every credential in it, so this
      # password is the key to the whole thing: make it long and unique, and put
      # the hostname behind Cloudflare Access as a second factor.
      #
      # Grafana reuses it. Grafana is served through this panel, behind this
      # login, so a second admin password was a second thing to rotate and
      # nothing extra to breach.
      ADMIN_USER=admin
      ADMIN_PASSWORD=REPLACE_ME_LONG_RANDOM

      # --- self-update --------------------------------------------------------
      # THE REPO IS THE SOURCE OF TRUTH. A timer compares the commit last
      # applied against this branch's head and re-applies the bundle when they
      # differ. It is also the GHCR namespace the panel, overseer, autoscaler
      # and dataguard images are pulled from, tagged with that commit — so
      # nothing is built on this box and there is no image setting to get wrong.
      #
      # Put the token in as the PASSWORD. A bare https://<token>@github.com/...
      # is userinfo with no password, which git reads as a username and then
      # asks for a password no timer job can answer:
      #   https://x-access-token:<token>@github.com/you/repo.git
      # A token is needed even for a PUBLIC repo: GitHub answers an anonymous
      # fetch from a cloud IP with 401 often enough to look like a dead network.
      INFRA_REPO_URL=https://x-access-token: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@github.com/dhng22/hetzner-infra.git
      INFRA_REPO_BRANCH=master
      # How often to ask whether the branch moved. One `git ls-remote` a tick,
      # which transfers nothing when nothing has changed.
      INFRA_UPDATE_INTERVAL=5min

  # ---------------------------------------------------------------------------
  - path: /opt/infra/bootstrap.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      set -a; source /etc/infra/infra.env; set +a
      exec > >(tee -a /var/log/infra-bootstrap.log) 2>&1
      echo "=== bootstrap started $(date -Is) ==="

      # --- fetch the bundle, and remember exactly which commit it is ----------
      # THE COMMIT IS THE VERSION: every infrastructure image is published by
      # GitHub Actions tagged with the commit it was built from, so recording
      # the SHA here is what lets the very first boot name them.
      #
      # Skipped if /opt/infra/stacks exists, so re-running does not re-clone. A
      # tree put there by hand has no commit recorded, and the images are named
      # by commit — that case stops below with an explanation, not a guess.
      mkdir -p /opt/infra/state && chmod 700 /opt/infra/state
      if [ ! -e /opt/infra/stacks ]; then
        case "${INFRA_REPO_URL:-}" in
          ""|*REPLACE_ME*)
            echo "FATAL: /opt/infra has no bundle and INFRA_REPO_URL still says" >&2
            echo "REPLACE_ME. Put a GitHub token in it — as the password, in the" >&2
            echo "x-access-token: slot. A PUBLIC repo needs one too: GitHub answers" >&2
            echo "an unauthenticated fetch from a cloud IP with 401. Read-only" >&2
            echo "'contents' is enough." >&2
            exit 1
            ;;
        esac
        # The same credential repair bin/infra-update does, repeated because
        # this is the boot that INSTALLS bin/infra-update and cannot source it.
        # Anything already carrying a colon is a deliberate user:secret.
        clone_url="$INFRA_REPO_URL"
        case "$clone_url" in
          http://*|https://*)
            _rest="${clone_url#*://}"
            case "${_rest%%/*}" in
              *@*)
                case "${_rest%%@*}" in
                  *:*) ;;
                  *) clone_url="${clone_url%%://*}://x-access-token:${_rest}" ;;
                esac
                ;;
            esac
            ;;
        esac
        # The URL carries the token and a cloud-init log is readable by anyone
        # who can reach the console, so it is redacted everywhere it is printed.
        redact() { sed -e 's#://[^/@[:space:]]*@#://***@#g' \
                       -e 's#gh[pousr]_[A-Za-z0-9]\{16,\}#***#g' \
                       -e 's#github_pat_[A-Za-z0-9_]\{16,\}#***#g'; }
        echo "cloning $(printf '%s' "$INFRA_REPO_URL" | redact) (${INFRA_REPO_BRANCH:-master})"
        rm -rf /tmp/infra-bundle
        if ! clone_err="$(GIT_TERMINAL_PROMPT=0 git clone --quiet --depth 1 \
             --branch "${INFRA_REPO_BRANCH:-master}" "$clone_url" \
             /tmp/infra-bundle 2>&1)"; then
          # git's own words, not "could not clone": an expired token, a wrong
          # branch and a dead network are three different mornings.
          echo "FATAL: could not clone $(printf '%s' "$INFRA_REPO_URL" | redact)" >&2
          printf '%s\n' "$clone_err" | redact >&2
          exit 1
        fi
        git -C /tmp/infra-bundle rev-parse HEAD > /opt/infra/state/commit
        # The working files, not a checkout: bin/infra-update compares
        # /opt/infra against a freshly fetched tree, and a .git directory here
        # would be one more thing for it to skip.
        rm -rf /tmp/infra-bundle/.git
        cp -a /tmp/infra-bundle/. /opt/infra/
        rm -rf /tmp/infra-bundle
      fi

      # --- preflight ----------------------------------------------------------
      # This script is written by cloud-init; the rest of the bundle is not. Say
      # so plainly instead of failing later on a missing stack file. The list
      # comes FROM the bundle, because this file is baked into the VM at
      # creation and never revised — a second copy of "what must exist" would
      # refuse to boot over a file the repo had deliberately dropped.
      manifest=/opt/infra/config/required-files
      if [ -f "$manifest" ]; then
        required_list="$(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' "$manifest")"
      else
        required_list="stacks/monitoring.yml stacks/ingress.yml stacks/admin.yml
      config/vmagent.yml.tpl config/alerts.yml bin/component bin/stack-deploy
      bin/infra-images"
      fi
      for required in $required_list bin/panel-hostops; do
        if [ ! -e "/opt/infra/$required" ]; then
          echo "FATAL: /opt/infra/$required is missing." >&2
          echo "The bundle in /opt/infra is incomplete. Delete it and re-run this" >&2
          echo "script to clone it again, or scp stacks/ config/ bin/ into" >&2
          echo "/opt/infra yourself." >&2
          exit 1
        fi
      done
      chmod +x /opt/infra/bin/* 2>/dev/null || true

      # Every REPLACE_ME is checked here, before anything is installed or
      # created. Discovering a missing token after swarm init and two stack
      # deploys leaves you reconciling half a cluster by hand.
      #
      # Infrastructure only: nothing about an application is in this file — no
      # image, no port, no service name, no SLO. Those arrive with a component.
      missing=()
      for v in APP_NAME ROOT_DOMAIN HCLOUD_TOKEN HCLOUD_NETWORK_NAME \
               GHCR_USER GHCR_TOKEN CF_TUNNEL_TOKEN ADMIN_USER ADMIN_PASSWORD; do
        case "${!v:-}" in
          ""|REPLACE_ME*) missing+=("$v") ;;
        esac
      done
      if [ "${#missing[@]}" -gt 0 ]; then
        echo "FATAL: unset or still REPLACE_ME in /etc/infra/infra.env:" >&2
        printf '  - %s\n' "${missing[@]}" >&2
        exit 1
      fi

      # Alerting is NOT in that list. Refusing to boot over it was too blunt —
      # you cannot always have the destination ready when you create the server,
      # and a cluster you cannot bring up is worse than one that tells you what
      # is missing. So it warns, installs a receiver that visibly drops
      # everything, and `smoke-test` fails until you fix it. The property worth
      # keeping was never "refuse to boot" but "never look like it is working".
      if [ ! -s /opt/infra/state/alert_targets.json ]; then
        echo "WARNING: no alert destination is configured." >&2
        echo "Alerts will be generated, grouped — and dropped. Add one in the" >&2
        echo "panel under Alerts > Targets; nothing needs editing on this box." >&2
      fi

      # Whether the master can hold the replica floor is measured at runtime
      # from live Swarm reservations, which this script cannot see. Advisory
      # only: a small master still works, it just never returns to the free
      # single-host state and always keeps a worker running.
      MASTER_CPUS="$(nproc)"
      if [ "$MASTER_CPUS" -lt 4 ]; then
        echo "NOTE: this master has ${MASTER_CPUS} vCPU. After the monitoring stack" >&2
        echo "and the panel reserve theirs, there may be no room left for your" >&2
        echo "components — in which case a worker always stays up and the free" >&2
        echo "floor is unreachable. Check the 'measured capacity' line in:" >&2
        echo "  docker service logs monitoring_autoscaler" >&2
      fi

      PRIVATE_IP="$(ip -4 -o addr show | awk '$4 ~ /^10\./ {print $4}' | cut -d/ -f1 | head -n1)"
      if [ -z "$PRIVATE_IP" ]; then
        echo "FATAL: no private network IP. Attach the server to a private network." >&2
        exit 1
      fi
      echo "MASTER_PRIVATE_IP=$PRIVATE_IP" >> /etc/infra/infra.env
      export MASTER_PRIVATE_IP="$PRIVATE_IP"
      echo "private ip: $PRIVATE_IP"

      # --- firewall: swarm ports must never face the internet -----------------
      ufw --force reset
      ufw default deny incoming
      ufw default allow outgoing
      ufw allow 22/tcp
      ufw allow from 10.0.0.0/8

      # Containers on this host reaching this host's own published ports, which
      # `from 10.0.0.0/8` does NOT cover: a container's packets leave through
      # docker_gwbridge and arrive with a 172.x source. Host-mode publishing
      # installs no DNAT rule, so unlike an ingress-mode port this is real INPUT
      # traffic that ufw evaluates — and drops.
      #
      # The whole interface, deliberately. The port-by-port version of this rule
      # shipped covering only the panel's 3000, which left vmagent unable to
      # scrape the master at all: no CPU-per-replica signal for the autoscaler,
      # and a manager reading "unknown" in the panel. docker_gwbridge is
      # reachable only from containers on this host, and all of those are ours.
      ufw allow in on docker_gwbridge

      ufw --force enable

      # --- docker -------------------------------------------------------------
      # get.docker.com is NOT used: it runs apt behind `-qq >/dev/null`, so a
      # held dpkg lock or a missing package produces no error at all and the
      # first symptom is `docker: command not found` a hundred lines later.

      # cloud-init's own package_upgrade and unattended-upgrades both run at
      # boot and both hold the dpkg lock. apt does not queue; it exits.
      for _ in $(seq 1 90); do
        fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break
        echo "waiting for dpkg lock to clear..."
        sleep 5
      done

      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
        -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      printf 'deb [arch=%s signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu %s stable\n' \
        "$(dpkg --print-architecture)" \
        "$(. /etc/os-release && echo "$VERSION_CODENAME")" \
        > /etc/apt/sources.list.d/docker.list
      apt-get update

      # Named explicitly, and deliberately WITHOUT docker-model-plugin, which
      # the install script adds to the same transaction. apt fails a transaction
      # atomically, so one unpublished package leaves the box with no docker.
      DEBIAN_FRONTEND=noninteractive apt-get install -y \
        docker-ce docker-ce-cli containerd.io \
        docker-buildx-plugin docker-compose-plugin

      systemctl enable --now docker

      # Everything below assumes a working daemon. Stop here rather than at
      # `docker swarm init`, with the firewall already reconfigured.
      if ! docker version >/dev/null 2>&1; then
        echo "FATAL: docker did not install, or the daemon is not running." >&2
        echo "See the apt output above, and: systemctl status docker" >&2
        exit 1
      fi

      # --- registry login, so the manager can resolve image digests ----------
      echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      # --- swarm, on the private interface ------------------------------------
      # --default-addr-pool is not optional and cannot be changed after init.
      # Swarm's own default pool is 10.0.0.0/8, so `ingress` takes 10.0.0.0/24 —
      # and a Hetzner private network is 10.0.0.0/16, handing this master
      # 10.0.0.2 and the workers .3, .4, .5. The overlay subnet would contain
      # the host addresses of the nodes carrying it.
      #
      # Nothing complains at init. It surfaces later as workers that join and
      # then cannot be reached, which reads like a Hetzner fault rather than an
      # address the cluster assigned itself. 172.20/16 gives 256 overlays, well
      # past what this cluster can create.
      #
      # Re-running this on a swarm initialised WITHOUT the flag: the pool is
      # baked in, so `docker swarm leave --force` first. That destroys the
      # secrets too, which this script recreates.
      docker swarm init --advertise-addr "$PRIVATE_IP" --listen-addr "$PRIVATE_IP:2377" \
        --default-addr-pool 172.20.0.0/16 --default-addr-pool-mask-length 24 || true
      MASTER_ID="$(docker info -f '{{.Swarm.NodeID}}')"
      docker node update --label-add role=master "$MASTER_ID"

      docker plugin install grafana/loki-docker-driver:3.1.1 \
        --alias loki --grant-all-permissions || true

      # --- secrets -------------------------------------------------------------
      # Infrastructure credentials only. Application credentials (MONGO_URI,
      # REDIS_PASSWORD) are deliberately NOT secrets: they are plain env vars in
      # config/app-<env>.env so the admin panel can edit them.
      #
      # The Telegram bot token is deliberately absent. It has to be optional (a
      # stack cannot reference a secret that may not exist) and editable in the
      # panel (Swarm secrets are immutable), so bin/stack-deploy renders it into
      # config/alertmanager.yml at 0600 instead.
      mk_secret() { printf '%s' "$2" | docker secret create "$1" - 2>/dev/null || true; }
      mk_secret CF_TUNNEL_TOKEN           "$CF_TUNNEL_TOKEN"
      mk_secret HCLOUD_TOKEN              "$HCLOUD_TOKEN"
      # Grafana mounts ADMIN_PASSWORD as well as the panel: one login for the
      # console and the dashboards it serves.
      mk_secret ADMIN_USER                "$ADMIN_USER"
      mk_secret ADMIN_PASSWORD            "$ADMIN_PASSWORD"
      # Signs admin session cookies. Generated here, never in infra.env: it is
      # not a knob, and regenerating it simply logs everyone out.
      mk_secret SESSION_SECRET            "$(openssl rand -hex 32)"

      # --- host access for the admin panel -------------------------------------
      # The panel manages the firewall, which lives on the host and is not
      # reachable through the docker socket. It gets one key, and that key's
      # authorized_keys entry FORCES bin/panel-hostops — so the panel cannot run
      # an arbitrary command as root, only the verbs that script implements.
      # `restrict` also disables port/agent/X11 forwarding and PTYs.
      PANEL_KEY=/opt/infra/state/panel_ssh
      mkdir -p /opt/infra/state && chmod 700 /opt/infra/state
      if [ ! -f "$PANEL_KEY" ]; then
        ssh-keygen -t ed25519 -N "" -C "admin-panel@${APP_NAME}" -f "$PANEL_KEY" >/dev/null
      fi
      mkdir -p /root/.ssh && chmod 700 /root/.ssh
      touch /root/.ssh/authorized_keys && chmod 600 /root/.ssh/authorized_keys
      PANEL_PUB="$(cat "${PANEL_KEY}.pub")"
      if ! grep -qF "$PANEL_PUB" /root/.ssh/authorized_keys 2>/dev/null; then
        printf 'command="/opt/infra/bin/panel-hostops",restrict %s\n' "$PANEL_PUB" \
          >> /root/.ssh/authorized_keys
        echo "installed forced-command key for the admin panel"
      fi
      # Created FROM THE FILE, not through mk_secret. `$(cat key)` strips the
      # trailing newline and `printf '%s'` does not put one back, so the secret
      # arrived one byte short — and OpenSSH rejects a private key that does not
      # end in a newline with "error in libcrypto". Every host operation then
      # failed with a key that diffs clean except for its last byte.
      docker secret create PANEL_SSH_KEY "$PANEL_KEY" >/dev/null 2>&1 || true

      # --- component storage ---------------------------------------------------
      # Applications and databases live here, one directory each, created by the
      # panel or by `component create`. Nothing is seeded: an empty cluster has
      # no components, which is a valid state.
      mkdir -p /opt/infra/components
      chmod 700 /opt/infra/components

      # --- render templates ---------------------------------------------------
      # vmagent.yml and alertmanager.yml are rendered by bin/stack-deploy, not
      # here, so editing the alert destination in the panel and redeploying
      # monitoring rebuilds the config it mounts.
      cp /opt/infra/config/worker-cloud-init.yaml.tpl \
         /opt/infra/config/worker-cloud-init.yaml

      # --- infrastructure images: PULLED, never built --------------------------
      # Building them here cost a fresh master minutes of its boot and left the
      # cluster running images that existed nowhere else, so `docker stack
      # deploy` could not resolve them to a digest. They are built, tested and
      # published by .github/workflows/publish.yml, one immutable tag per
      # commit, and this pulls the exact commit this master was cloned from.
      . /opt/infra/bin/infra-images
      infra_images "$(cat /opt/infra/state/commit 2>/dev/null || true)" || exit 1
      echo "infrastructure images: $(infra_image_repo) at ${INFRA_IMAGE_COMMIT:0:12}"

      # A master created moments after a push gets here before the build has
      # finished, so it waits — up to twenty minutes, saying what for. A build
      # that FAILED looks identical until the deadline, then stops with the
      # registry's own reason.
      for ref in $(infra_image_refs); do
        pulled=0
        for attempt in $(seq 1 40); do
          if docker pull --quiet "$ref" >/dev/null 2>&1; then pulled=1; break; fi
          echo "  $ref is not published yet (attempt ${attempt}/40); waiting 30s"
          sleep 30
        done
        if [ "$pulled" != "1" ]; then
          echo "FATAL: $ref never appeared." >&2
          echo "Check the repository's Actions tab — the build for this commit" >&2
          echo "probably failed. If the GHCR package is private, GHCR_USER and" >&2
          echo "GHCR_TOKEN in infra.env need read:packages on it. The pull said:" >&2
          docker pull "$ref" >&2 || true
          exit 1
        fi
      done

      # What bin/stack-deploy reads to know which image tag to deploy, and what
      # bin/infra-update reads on its first tick. Written only once the images
      # are here, so a master that could not pull them does not claim the commit.
      cat > /opt/infra/state/version.json <<JSON
      {
        "commit": "${INFRA_IMAGE_COMMIT}",
        "remote": "${INFRA_IMAGE_COMMIT}",
        "branch": "${INFRA_REPO_BRANCH:-master}",
        "previous": "",
        "updated_at": "$(date -Is)",
        "checked_at": "$(date -Is)",
        "status": "ok",
        "detail": ""
      }
      JSON
      chmod 600 /opt/infra/state/version.json

      # --- networks -------------------------------------------------------------
      # `edge` is created here rather than by a stack, because every component
      # declares it external and no component may own it. When it belonged to
      # the app stack, removing that stack took the network — and the tunnel's
      # route to everything else — with it.
      #
      # `--opt encrypted` is defence in depth, NOT the mechanism: replication
      # crosses this network, and what protects it is TLS inside mongod, because
      # an overlay's IPsec stops at the container boundary. It cannot be added to
      # an existing network, so a cluster built before this line stays
      # unencrypted at the overlay until rebuilt — and is still TLS end to end.
      docker network inspect edge >/dev/null 2>&1 \
        || docker network create --driver overlay --attachable --opt encrypted edge

      # --- monitoring first: it creates the `monitoring` network the other two
      # stacks declare external, and the autoscaler needs somewhere to read from.
      /opt/infra/bin/stack-deploy monitoring

      # --- ingress -------------------------------------------------------------
      # The tunnel connector, depending on nothing. It comes up with no routes
      # to serve and that is correct: you add a hostname in Cloudflare when you
      # create the component it points at.
      if [ -d /opt/infra/bin ]; then
        chmod +x /opt/infra/bin/*
        ln -sf /opt/infra/bin/component /usr/local/bin/component
      fi
      /opt/infra/bin/stack-deploy ingress

      # --- self-update timer ---------------------------------------------------
      # A timer rather than anything inside the panel, because an update
      # redeploys the panel — a container cannot restart itself and still be
      # around to report how it went.
      cat > /etc/systemd/system/infra-update.service <<'UNIT'
      [Unit]
      Description=Bring /opt/infra up to the infrastructure repo's newest commit
      After=network-online.target docker.service
      Wants=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/opt/infra/bin/infra-update
      # The script takes its own flock, so an operator running it by hand cannot
      # race the timer against the same `docker stack deploy`.
      TimeoutStartSec=1800
      UNIT

      cat > /etc/systemd/system/infra-update.timer <<UNIT
      [Unit]
      Description=Poll the infrastructure repo for new commits

      [Timer]
      # Not OnCalendar: OnUnitActiveSec measures from the END of the last run, so
      # a long rebuild cannot have the next tick queued up behind it.
      OnBootSec=2min
      OnUnitActiveSec=${INFRA_UPDATE_INTERVAL:-5min}
      AccuracySec=30s

      [Install]
      WantedBy=timers.target
      UNIT

      systemctl daemon-reload
      case "${INFRA_REPO_URL:-}" in
        ""|*REPLACE_ME*)
          echo "INFRA_REPO_URL is not set — self-update is OFF for this cluster." >&2
          echo "Infrastructure changes will have to be copied to /opt/infra by hand." >&2
          ;;
        *)
          systemctl enable --now infra-update.timer
          echo "self-update every ${INFRA_UPDATE_INTERVAL:-5min} from ${INFRA_REPO_BRANCH:-master}"
          ;;
      esac

      # --- admin panel ---------------------------------------------------------
      # Deployed last: it is the console for a cluster that must already be up.
      # It is the ONLY thing here with both the docker socket and a login form,
      # so it is deliberately the smallest surface we can get away with. Through
      # stack-deploy rather than envsubst, because the stack names
      # ${INFRA_IMAGE_ADMIN} and there is exactly one place that resolves it.
      /opt/infra/bin/stack-deploy admin

      echo "=== bootstrap finished $(date -Is) ==="
      echo
      echo "Workers do not exist yet — the autoscaler creates the first one on"
      echo "its first loop. Watch:  docker service logs -f monitoring_autoscaler"
      echo
      echo "Cloudflare tunnel hostname to add now:"
      echo "  admin-${APP_NAME}.${ROOT_DOMAIN}  -> http://${PRIVATE_IP}:3000"
      echo
      echo "Put it behind Cloudflare Access. The admin panel holds the docker"
      echo "socket and can redeploy anything — its password is the cluster."
      echo "Access in front of it is your second factor. Grafana is served"
      echo "through the panel at /grafana/ and needs no hostname of its own."
      echo
      echo "Scaling, database and alerting policy all have working defaults."
      echo "Change them in the panel: Manager > Fleet, Manager > Databases."
      echo
      echo "There are no applications yet, on purpose. Create one in the panel"
      echo "(Components -> New app), or on this box:"
      echo "  component create app api --image ghcr.io/you/app:tag --port 8080"
      echo "Then add its hostname in Cloudflare, pointing at the local target"
      echo "the panel shows you."

runcmd:
  # The clone lives INSIDE bootstrap.sh so it reads INFRA_REPO_URL from the file
  # you edited above. Two spellings of "which repo is this cluster" is a master
  # built from one branch and updated from another.
  - [ bash, -lc, "mkdir -p /opt/infra" ]
  - [ bash, -lc, "/opt/infra/bootstrap.sh" ]

final_message: "Master ready after $UPTIME seconds. See /var/log/infra-bootstrap.log"
