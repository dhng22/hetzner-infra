groups:
  - name: meta
    rules:
      # Always firing, on purpose. Proves rules are being evaluated AND that
      # the receiver is reachable. Every other rule in this file is silent when
      # things are healthy, which is indistinguishable from a broken pipeline.
      # Routed to its own 24h receiver so it is a daily heartbeat, not noise.
      - alert: Watchdog
        expr: vector(1)
        labels: { severity: none }
        annotations:
          summary: "Alerting pipeline is alive"

  - name: infra
    rules:
      - alert: NodeDown
        expr: up{job="node"} == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "Node {{ $labels.instance }} is not reporting"

      - alert: NodeDiskFilling
        expr: |
          (1 - node_filesystem_avail_bytes{mountpoint="/"}
             / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Disk over 85% on {{ $labels.instance }}"

      # Both sides are WORKER counts, so this is a straight comparison against
      # the budget you set. The master is not a worker and never was: it is the
      # control plane that happens to carry the load while no worker exists.
      #
      # Distinct from ReplicaCeiling, which means "this component is out of
      # replicas". Either can trip without the other.
      - alert: FleetAtMax
        expr: overseer_current_workers >= overseer_max_workers
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "The fleet is pinned at MAX_WORKERS — raise the ceiling or optimise"

      # The app is pinned to worker nodes and there are no worker nodes, so
      # every task is unplaceable. The overseer dispatches a release on its next
      # loop and the autoscaler applies it, which makes this self-healing within
      # ~2 minutes across the two processes — so if it is still true after five,
      # the recovery itself is broken (no docker CLI in the image, socket
      # permissions, a rollout wedged mid-flight, or the dispatch not arriving).
      #
      # BOTH GAUGES MUST COME FROM ONE PROCESS. They carry no `service` label of
      # their own, so vmagent gives them the exporting Swarm service's name, and
      # `and` between two exporters would match nothing — silently, forever.
      # That is why every unlabeled fleet gauge lives in the overseer rather than
      # being split with the half that applies them.
      - alert: AppStrandedWithoutWorkers
        expr: overseer_placement_worker_mode == 1 and overseer_current_workers < 1
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "App is pinned to worker nodes but no worker exists — tasks cannot be placed"

      # The autoscaler swallows its own errors so one bad loop cannot kill it —
      # which means a persistently failing stage is invisible without this.
      # `stage` distinguishes them: "placement" is a constraint change that will
      # not apply, "handover" is a scale-in that cannot finish, "query" is
      # usually VictoriaMetrics being unreachable. A couple of blips are normal;
      # a sustained rate is not.
      - alert: AutoscalerErrors
        expr: sum by (stage) (rate(autoscaler_errors_total[10m])) > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Autoscaler is failing repeatedly in stage '{{ $labels.stage }}'"

      # AutoscalerStalled computes time() - gauge, which returns NO SERIES if
      # the autoscaler's scrape target disappears altogether — the exact case it
      # looks like it covers. Every per-component rule now depends on gauges
      # this process exports, so its absence has to page on its own.
      - alert: AutoscalerAbsent
        expr: absent(autoscaler_last_loop_timestamp_seconds)
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "The autoscaler is not being scraped at all — every scaling alert is blind"

      - alert: AutoscalerStalled
        expr: time() - autoscaler_last_loop_timestamp_seconds > 300
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Autoscaler has not completed a loop in 5 minutes"

      # The overseer decides; the autoscaler and dataguard only apply. Its
      # absence is therefore louder than either of theirs: nothing changes size,
      # no machine is bought or sold, and no database is looked at.
      - alert: OverseerAbsent
        expr: absent(overseer_last_loop_timestamp_seconds)
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "The overseer is not being scraped at all — nothing is deciding anything"

      - alert: OverseerStalled
        expr: time() - overseer_last_loop_timestamp_seconds > 300
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Overseer has not completed a loop in 5 minutes — the fleet is frozen"

  # --- databases ------------------------------------------------------------
  # Every rule keys on a dataguard gauge with a `component` label rather than
  # naming a database, because component names are created at runtime and a rule
  # that names one is a rule somebody has to remember to add.
  - name: data
    rules:
      # The loudest thing in this file. No primary means no writes, and unlike a
      # slow service it does not degrade — it stops.
      - alert: NoPrimary
        expr: max by (component) (dataguard_members{state="PRIMARY"}) < 1
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.component }} has no primary — it is refusing writes"

      - alert: ReplicaLagOverBudget
        expr: max by (component) (dataguard_replication_lag_seconds) > 60
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.component }} has a replica more than 60s behind"

      # A transition that started and did not finish. Dataguard takes one step
      # per loop and re-reads the world each time, so "in flight" for hours means
      # an initial sync that is not progressing rather than a step that hung.
      - alert: TopologyChangeStuck
        expr: max by (component) (dataguard_topology_change_in_flight) == 1
        for: 6h
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.component }} has been mid-transition for six hours"

      - alert: BackupOverdue
        expr: time() - max by (component) (dataguard_backup_last_success_timestamp) > 172800
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.component }} has not been backed up in two days"

      # A BACKUP NOBODY HAS RESTORED IS A HYPOTHESIS. This is the rule that
      # separates "we have backups" from "we can recover", and it is the one
      # people find out about the hard way when it is missing.
      - alert: BackupNeverVerified
        expr: time() - max by (component) (dataguard_backup_last_verified_timestamp) > 1209600
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.component }}'s backups have not been proven to restore in two weeks"

      # An expired member certificate does not degrade a replica set, it stops
      # it: members refuse each other and there is no primary. Renewal starts a
      # month out, so this firing means renewal itself is not working.
      - alert: TLSCertExpiring
        expr: min by (component) (dataguard_tls_days_remaining) < 14
        for: 1h
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.component }} has a member certificate expiring in under 14 days"

      # Informational on purpose. A restore refuses writes for as long as it
      # runs, and somebody looking at a database that is refusing writes should
      # be able to find out why from the same place they find everything else.
      - alert: RestoreInFlight
        expr: dataguard_restore_in_flight == 1
        for: 1m
        labels: { severity: info }
        annotations:
          summary: "A database restore is running — that database is refusing writes"

      - alert: DataguardAbsent
        expr: absent(dataguard_last_loop_timestamp_seconds)
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Dataguard is not being scraped — no database is being watched"

      - alert: DataguardStalled
        expr: time() - dataguard_last_loop_timestamp_seconds > 600
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Dataguard has not completed a loop in ten minutes"

  - name: app
    rules:
      # Per component, not per environment. `service` is the Swarm name and is
      # written by the vmagent relabel; grouping by it is what makes one noisy
      # component visible instead of averaged into every other one.
      #
      # The traffic floor is not cosmetic: with several components, one request
      # and one error is a 100% ratio, and this routes to a critical receiver.
      #
      # THIS RULE COULD NOT FIRE. It read `http_server_requests_seconds_count`,
      # and no series by that name has ever existed in this cluster: the one
      # application here publishes the Micrometer JVM binders and no HTTP timer
      # at all, so both sides of the ratio were empty and the alert was silent
      # for reasons that looked exactly like "no errors".
      #
      # The tunnel connector does count responses by status code, and it counts
      # every request that reaches the cluster, so that is what this reads now.
      # It is a WEAKER claim, and the summary says so: it is the whole edge, not
      # one component. Give an application a `ktor_http_server_requests_seconds`
      # (or any `http_server_requests_seconds`) timer and the per-service
      # version becomes possible again — the Overview page's RED card names the
      # same gap in the same words.
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(cloudflared_tunnel_response_by_code{status_code=~"5.."}[5m]))
            / clamp_min(sum(rate(cloudflared_tunnel_response_by_code[5m])), 0.001)
          ) > 0.05
          and sum(rate(cloudflared_tunnel_response_by_code[5m])) > 0.2
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Over 5% of responses at the tunnel are 5xx"

      # Both sides carry `service`, so this compares each component against its
      # OWN SLO and produces one alert instance per breaching component. A
      # filtering comparison returns the left-hand series with its labels
      # intact, which is what carries the name into the annotation.
      - alert: SLOBreach
        expr: autoscaler_service_p95_ms > on (service) autoscaler_service_slo_p95_ms
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "p95 on {{ $labels.service }} is above its SLO and the autoscaler has not recovered it"

      # A SERVICE THE CPU CAP IS HOLDING BACK.
      #
      # The cap used to be derived from CPU consumed, which a capped container
      # cannot exceed — so the measurement that set it was suppressed by it, and
      # a strangled service reported itself idle. The autoscaler now raises the
      # cap on this signal instead. This alert is for when that has not worked:
      # the service is already at the node's ceiling, or the raise is stuck
      # behind its cooldown, or something re-applied a smaller number.
      #
      # It is worth waking somebody for because the damage is invisible in every
      # other view. Throttling does not show up as CPU pressure, an error, or a
      # failed health check — the requests all succeed, they just take five
      # scheduling periods instead of one, and the service looks nearly idle the
      # whole time it is happening.
      - alert: ServiceCpuThrottled
        expr: |
          max by (container_label_com_docker_swarm_service_name) (
            rate(container_cpu_cfs_throttled_periods_total[10m])
            / clamp_min(rate(container_cpu_cfs_periods_total[10m]), 1)
          ) * 100 > 5
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.container_label_com_docker_swarm_service_name }} is being cut off by its CPU cap"
          description: >-
            More than 5% of this service's scheduling periods end with the
            kernel stopping it because it has used its CPU quota. Every request
            being served at that moment waits for the next period, which turns
            milliseconds of work into hundreds of milliseconds of latency. The
            autoscaler raises the cap on its own when it sees this; if the alert
            persists, it has run out of node to give or something is re-applying
            a smaller limit.

      # A SERVICE TOO BIG TO REDEPLOY.
      #
      # Every app renders `order: start-first, parallelism: 1`, so Swarm starts
      # a replacement task before stopping the one it replaces: a service at N
      # transiently needs room for N+1. Admission now reserves that slot, so the
      # exported ceiling is the largest count the node can still ROLL, not the
      # largest it can hold.
      #
      # It reads `overseer_service_rollout_ceiling`, NOT
      # `overseer_service_replica_ceiling`. The dispatched ceiling is floored at
      # the live count so admission can never shrink a running service, which
      # means a service already too big to roll has its ceiling raised straight
      # back to its own size and reports itself healthy. The rollout ceiling is
      # the same packing result before that floor — the number allowed to say
      # the service is over the line.
      #
      # Running above it is the one state where everything looks healthy and
      # nothing can ship. Every replica is up, no service is starved, the fleet
      # is the right size by its own arithmetic — and the next deploy's first
      # task sits `Pending: no suitable node` indefinitely while the service
      # keeps serving the previous image. That happened here for half an hour,
      # and the only evidence was a status field nobody was watching.
      #
      # The ceiling caps growth and never shrinks anything, by design, so this
      # does not clear itself: a service that grew past the line stays there
      # until demand falls or the fleet does. Hence a real alert rather than a
      # log line.
      - alert: ServiceAboveRolloutCeiling
        expr: |
          autoscaler_service_current_replicas
            > on (service) overseer_service_rollout_ceiling
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} has more replicas than its nodes can roll — deploys will hang"
          description: >-
            Its node cannot hold one more replica of this service, which is what
            `start-first` needs to replace a task. A deploy will be accepted,
            report success, and then sit with a task Pending forever while the
            old image keeps serving. Give the fleet room or let the service
            shrink; `docker service ps {{ $labels.service }}` names the stuck
            task.

      # Compare against the exported ceiling, never a literal.
      #
      # The two extra conjuncts are load-bearing. A FIXED-replica component sits
      # at current == max == min permanently and would page forever without
      # them, which with a handful of components means the rule is muted within
      # a week and then means nothing.
      #
      # Distinct from AutoscalerAtMax on purpose. That one means "out of node
      # budget"; this means "this component is out of replicas".
      # THE OVERSEER HAS GONE QUIET.
      #
      # It owns the performance loop: it measures, decides, and pushes a verdict
      # to whichever manager claims the cause. Managers do not poll, so if it
      # stops, nothing arrives, verdicts expire, and every service holds exactly
      # where it is.
      #
      # That is the intended failure — a fleet that stops changing rather than
      # one that falls back to a worse rule at the moment it can least afford
      # it. But it is INVISIBLE from the outside: a cluster nobody is scaling
      # looks exactly like a cluster nothing is happening to. This rule is what
      # makes the safe failure a noticed one.
      # THE ALERT ABOUT THE ALERTS, and the reason it exists is the failure it
      # is named for: a bot token was revoked, Alertmanager answered 401 on
      # every notification for two days, and nothing anywhere said so. Every
      # other rule in this file was firing correctly the whole time and being
      # dropped on the floor at the last hop.
      #
      # It cannot reach you through the channel it is reporting on — that is the
      # nature of it. It is here to be VISIBLE: on the panel's Alerts tab, in
      # Grafana, and in `smoke-test`. The other half of the answer is the
      # Watchdog's silence, which is the only signal that survives the notifier
      # being broken, and which nobody notices for a day.
      - alert: AlertDeliveryFailing
        expr: increase(alertmanager_notifications_failed_total[15m]) > 0
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: "alerts are NOT being delivered — {{ $labels.integration }} is rejecting them"
          description: >-
            Alertmanager has failed to deliver a notification for fifteen
            minutes. Every other alert in this cluster is being raised and
            discarded at the last hop. The usual cause is a credential the
            destination has since revoked: check
            `docker service logs monitoring_alertmanager` for the reply the
            provider actually gave, then re-enter the target under
            Alerts > Targets, which re-tests it and rolls Alertmanager onto the
            new config.

      - alert: OverseerSilent
        expr: autoscaler_services_awaiting_dispatch > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "no verdicts arriving — {{ $value }} service(s) frozen at their current replica count"
          description: >-
            The autoscaler has had no fresh verdict for at least ten minutes, so
            it is holding every replica count where it is. Placement, node
            lifecycle and reaping are unaffected. Check that monitoring_overseer
            is running and that the autoscaler service still carries
            infra.handles=local with a reachable infra.handles.port.

      # A manager claimed a cause and cannot be reached. Whatever it handles is
      # not being handled, and the manager itself cannot report that — it is not
      # being told anything at all.
      - alert: ManagerUnreachable
        expr: overseer_delivery_ok == 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.manager }} claims a cause but cannot be delivered to"
          description: >-
            The overseer has a verdict for {{ $labels.manager }} and its POST
            has been failing for ten minutes, so that manager is acting on
            nothing. Deliveries are level-triggered and retried every loop, so
            this clears by itself the moment the manager answers.

      # SOMETHING ELSE IS SLOW AND NOBODY OWNS IT.
      #
      # The autoscaler refuses to add replicas for a latency breach its own
      # replicas are not causing — more of them would only aim more concurrency
      # at whatever is already struggling. That refusal is correct and it is
      # also silent, so this is the rule that stops "we are not scaling" from
      # meaning "nobody ever finds out".
      #
      # The gauge belongs to the OVERSEER, not the autoscaler: attribution is
      # diagnosis, it has more than one consumer, and it has no business living
      # in the process that can delete servers.
      #
      # Only UNOWNED causes reach here. A cause some service claims with
      # `infra.handles` is that manager's to report, and a cause the operator
      # muted with `autoscale.mute_causes` is a decision already made — the
      # third-party API nobody will ever be able to speed up. Both zero the
      # gauge rather than being filtered here, so this rule needs no list of
      # exceptions and gains nothing to forget when a manager is added.
      #
      # 30m because a dependency having a bad ten minutes is not a page, and
      # because the thing being alerted on is by definition not something the
      # cluster can fix by itself.
      - alert: ThrottledByUnownedDependency
        expr: overseer_signal_unowned == 1
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} is slow because of {{ $labels.cause }}, and nothing handles it"
          description: >-
            p95 has been over budget for half an hour while the replicas
            themselves are idle, so the autoscaler is deliberately not scaling.
            The suspected cause is {{ $labels.cause }}; the overseer's log
            names the specific target. Either give something the
            infra.handles={{ $labels.cause }} label, or mute it on the component
            with autoscale.mute_causes.

      - alert: ReplicaCeiling
        expr: |
          (autoscaler_service_current_replicas >= on (service) autoscaler_service_max_replicas)
          and on (service) (autoscaler_service_autoscale_enabled == 1)
          and on (service) (autoscaler_service_max_replicas > autoscaler_service_min_replicas)
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} is at its replica ceiling — capacity plan or app efficiency issue"

      # THE OUTAGE RULE. It used to hardcode `service="app_api-prod"` and rely
      # on `or vector(0)` to survive the series vanishing — neither of which
      # generalises when the set of components is created at runtime and nobody
      # here knows their names.
      #
      # The anchor is now a gauge the AUTOSCALER owns, read from the Docker API
      # rather than from a scrape. It exists for exactly as long as the
      # component does, so "every replica is gone" is a value of 0 rather than
      # an absent series — which is the same property `or vector(0)` was buying,
      # obtained without naming anything.
      - alert: NoHealthyReplicas
        expr: |
          autoscaler_service_running_replicas == 0
          and on (service) (overseer_service_replica_ceiling > 0)
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} wants replicas but none are running"

      # The autoscaler is running but blind, so nothing will ever shrink.
      #
      # Scaling down requires a CPU-per-replica reading: a missing series holds
      # the replica count rather than shrinking it, which is the right choice
      # and an invisible one. cadvisor stopped exporting per-container metrics
      # after a Docker upgrade renamed its storage driver, and the only symptom
      # was "cpu/replica n/a" in a log — every service frozen at its current
      # size and a worker billed around the clock against no traffic.
      #
      # 20m because the signal legitimately gaps: cadvisor restarts on every
      # monitoring redeploy, and the rate() window needs to refill afterwards.
      - alert: AutoscalerSignalMissing
        expr: autoscaler_service_cpu_signal_present == 0
        for: 20m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }}: no CPU signal — the autoscaler cannot scale it down"

      # A deploy that silently un-happened.
      #
      # `docker stack deploy` is detached by default: it exits 0 as soon as
      # Swarm accepts the new spec, which is well before the tasks start, fail,
      # and get reverted by the service's own `failure_action: rollback`. So the
      # panel records a successful deploy, the component's files on disk show
      # the change, and the running service is still on the previous spec. There
      # is no error anywhere — the deploy reports success and the change is gone.
      #
      # Deliberately NOT folded into NoHealthyReplicas. A rollback is the
      # mechanism working: the previous version is still serving, so this is a
      # warning about a change that did not land, not a page about an outage.
      # A component that never had a good version to fall back to trips both.
      #
      # 2m rather than instant because `rollback_started` is a legitimate
      # transient — it is also how a healthy rollback begins.
      - alert: DeployRolledBack
        expr: autoscaler_service_deploy_rolled_back == 1
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }}: last deploy failed and Swarm rolled it back"

      # The other half of what NoHealthyReplicas used to conflate: tasks are
      # running, but nothing is scraping them. That is a monitoring failure, not
      # an outage, and it deserves a different severity and a different page.
      #
      # `or sum by (service) (gauge * 0)` synthesises the zero for whatever set
      # of components currently exists. `or vector(0)` could only ever do that
      # for one hardcoded name.
      - alert: ReplicasNotScraped
        expr: |
          (
            sum by (service) (up{job="swarm-services"})
            or
            sum by (service) (autoscaler_service_running_replicas * 0)
          ) < 1
          and on (service) (autoscaler_service_running_replicas > 0)
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} has running tasks but no scrapeable metrics"

      # The cluster cannot host a component's floor. Self-healing while there is
      # budget left, because the fleet is sized from the UNCAPPED demand — so if
      # this is still true ten minutes later, MAX_WORKERS is the binding
      # constraint and a human has to choose.
      - alert: AppMinReplicasUnsatisfiable
        expr: overseer_service_min_unsatisfied == 1
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} cannot reach its minimum replica count"

      # Tasks Swarm accepted but could not place. Distinct from the two rules
      # above: the replicas were admitted and the scheduler still said no,
      # which usually means a reservation that no longer fits any node.
      - alert: ReplicasPending
        expr: autoscaler_service_pending_replicas > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} has replicas that cannot be placed"
