groups:
  - name: meta
    rules:
      # Always firing, on purpose. Proves rules are being evaluated AND that
      # the receiver is reachable. Every other rule in this file is silent when
      # things are healthy, which is indistinguishable from a broken pipeline.
      # Routed to its own 24h receiver so it is a daily heartbeat, not noise.
      - alert: Watchdog
        expr: vector(1)
        labels: { severity: none }
        annotations:
          summary: "Alerting pipeline is alive"

  - name: infra
    rules:
      - alert: NodeDown
        expr: up{job="node"} == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "Node {{ $labels.instance }} is not reporting"

      - alert: NodeDiskFilling
        expr: |
          (1 - node_filesystem_avail_bytes{mountpoint="/"}
             / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Disk over 85% on {{ $labels.instance }}"

      # Both sides are WORKER counts, so this is a straight comparison against
      # the budget you set. The master is not a worker and never was: it is the
      # control plane that happens to carry the load while no worker exists.
      #
      # Distinct from ReplicaCeiling, which means "this component is out of
      # replicas". Either can trip without the other.
      - alert: AutoscalerAtMax
        expr: autoscaler_current_workers >= autoscaler_max_workers
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Autoscaler pinned at MAX_WORKERS — raise the ceiling or optimise"

      # The app is pinned to worker nodes and there are no worker nodes, so
      # every task is unplaceable. The autoscaler fails back to manager mode on
      # its next loop, which makes this self-healing within ~60s — so if it is
      # still true after two minutes, the recovery itself is broken (no docker
      # CLI in the image, socket permissions, a rollout wedged mid-flight).
      #
      # Both gauges come from the same target, so the labels match and `and`
      # composes them. This is the one state in the new placement model that is
      # a hard outage rather than a slow degradation.
      - alert: AppStrandedWithoutWorkers
        expr: autoscaler_placement_worker_mode == 1 and autoscaler_current_workers < 1
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "App is pinned to worker nodes but no worker exists — tasks cannot be placed"

      # The autoscaler swallows its own errors so one bad loop cannot kill it —
      # which means a persistently failing stage is invisible without this.
      # `stage` distinguishes them: "placement" is a constraint change that will
      # not apply, "handover" is a scale-in that cannot finish, "query" is
      # usually VictoriaMetrics being unreachable. A couple of blips are normal;
      # a sustained rate is not.
      - alert: AutoscalerErrors
        expr: sum by (stage) (rate(autoscaler_errors_total[10m])) > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Autoscaler is failing repeatedly in stage '{{ $labels.stage }}'"

      # AutoscalerStalled computes time() - gauge, which returns NO SERIES if
      # the autoscaler's scrape target disappears altogether — the exact case it
      # looks like it covers. Every per-component rule now depends on gauges
      # this process exports, so its absence has to page on its own.
      - alert: AutoscalerAbsent
        expr: absent(autoscaler_last_loop_timestamp_seconds)
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "The autoscaler is not being scraped at all — every scaling alert is blind"

      - alert: AutoscalerStalled
        expr: time() - autoscaler_last_loop_timestamp_seconds > 300
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Autoscaler has not completed a loop in 5 minutes"

  - name: app
    rules:
      # Per component, not per environment. `service` is the Swarm name and is
      # written by the vmagent relabel; grouping by it is what makes one noisy
      # component visible instead of averaged into every other one.
      #
      # The traffic floor is not cosmetic: with several components, one request
      # and one error is a 100% ratio, and this routes to a critical receiver.
      - alert: HighErrorRate
        expr: |
          (
            sum by (service) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum by (service) (rate(http_server_requests_seconds_count[5m]))
          ) > 0.05
          and on (service) (sum by (service) (rate(http_server_requests_seconds_count[5m])) > 0.2)
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Over 5% of requests to {{ $labels.service }} are returning 5xx"

      # Both sides carry `service`, so this compares each component against its
      # OWN SLO and produces one alert instance per breaching component. A
      # filtering comparison returns the left-hand series with its labels
      # intact, which is what carries the name into the annotation.
      - alert: SLOBreach
        expr: autoscaler_service_p95_ms > on (service) autoscaler_service_slo_p95_ms
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "p95 on {{ $labels.service }} is above its SLO and the autoscaler has not recovered it"

      # Compare against the exported ceiling, never a literal.
      #
      # The two extra conjuncts are load-bearing. A FIXED-replica component sits
      # at current == max == min permanently and would page forever without
      # them, which with a handful of components means the rule is muted within
      # a week and then means nothing.
      #
      # Distinct from AutoscalerAtMax on purpose. That one means "out of node
      # budget"; this means "this component is out of replicas".
      - alert: ReplicaCeiling
        expr: |
          (autoscaler_service_current_replicas >= on (service) autoscaler_service_max_replicas)
          and on (service) (autoscaler_service_autoscale_enabled == 1)
          and on (service) (autoscaler_service_max_replicas > autoscaler_service_min_replicas)
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} is at its replica ceiling — capacity plan or app efficiency issue"

      # THE OUTAGE RULE. It used to hardcode `service="app_api-prod"` and rely
      # on `or vector(0)` to survive the series vanishing — neither of which
      # generalises when the set of components is created at runtime and nobody
      # here knows their names.
      #
      # The anchor is now a gauge the AUTOSCALER owns, read from the Docker API
      # rather than from a scrape. It exists for exactly as long as the
      # component does, so "every replica is gone" is a value of 0 rather than
      # an absent series — which is the same property `or vector(0)` was buying,
      # obtained without naming anything.
      - alert: NoHealthyReplicas
        expr: |
          autoscaler_service_running_replicas == 0
          and on (service) (autoscaler_service_admitted_replicas > 0)
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} wants replicas but none are running"

      # The other half of what NoHealthyReplicas used to conflate: tasks are
      # running, but nothing is scraping them. That is a monitoring failure, not
      # an outage, and it deserves a different severity and a different page.
      #
      # `or sum by (service) (gauge * 0)` synthesises the zero for whatever set
      # of components currently exists. `or vector(0)` could only ever do that
      # for one hardcoded name.
      - alert: ReplicasNotScraped
        expr: |
          (
            sum by (service) (up{job="swarm-services"})
            or
            sum by (service) (autoscaler_service_running_replicas * 0)
          ) < 1
          and on (service) (autoscaler_service_running_replicas > 0)
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} has running tasks but no scrapeable metrics"

      # The cluster cannot host a component's floor. Self-healing while there is
      # budget left, because the fleet is sized from the UNCAPPED demand — so if
      # this is still true ten minutes later, MAX_WORKERS is the binding
      # constraint and a human has to choose.
      - alert: AppMinReplicasUnsatisfiable
        expr: autoscaler_service_min_unsatisfied == 1
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} cannot reach its minimum replica count"

      # Tasks Swarm accepted but could not place. Distinct from the two rules
      # above: the replicas were admitted and the scheduler still said no,
      # which usually means a reservation that no longer fits any node.
      - alert: ReplicasPending
        expr: autoscaler_service_pending_replicas > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} has replicas that cannot be placed"
