groups:
  - name: meta
    rules:
      # Always firing, on purpose. Proves rules are being evaluated AND that
      # the receiver is reachable. Every other rule in this file is silent when
      # things are healthy, which is indistinguishable from a broken pipeline.
      # Routed to its own 24h receiver so it is a daily heartbeat, not noise.
      - alert: Watchdog
        expr: vector(1)
        labels: { severity: none }
        annotations:
          summary: "Alerting pipeline is alive"

  - name: infra
    rules:
      - alert: NodeDown
        expr: up{job="node"} == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "Node {{ $labels.instance }} is not reporting"

      - alert: NodeDiskFilling
        expr: |
          (1 - node_filesystem_avail_bytes{mountpoint="/"}
             / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Disk over 85% on {{ $labels.instance }}"

      - alert: AutoscalerAtMax
        expr: autoscaler_current_workers >= autoscaler_max_workers
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Autoscaler pinned at MAX_WORKERS — raise the ceiling or optimise"

      - alert: AutoscalerStalled
        expr: time() - autoscaler_last_loop_timestamp_seconds > 300
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Autoscaler has not completed a loop in 5 minutes"

  - name: app
    rules:
      - alert: HighErrorRate
        expr: |
          sum by (env) (rate(http_server_requests_seconds_count{status=~"5..",env="prod"}[5m]))
          / sum by (env) (rate(http_server_requests_seconds_count{env="prod"}[5m])) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Over 5% of requests are returning 5xx"

      - alert: SLOBreach
        expr: autoscaler_app_p95_ms > autoscaler_slo_p95_ms
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "p95 is above the SLO and the autoscaler has not recovered it"

      # Compare against the exported ceiling, never a literal. This hardcoded
      # `>= 12`, so raising MAX_REPLICAS left the alert pinned to the old
      # number — the same config-drift failure that killed NoHealthyReplicas.
      # AutoscalerAtMax already does it correctly; this now mirrors it.
      #
      # The old `desired >= current` conjunct added nothing: at the ceiling the
      # autoscaler clamps desired to current, so it is true by construction.
      #
      # Distinct from AutoscalerAtMax on purpose. That one means "out of node
      # budget"; this means "out of replicas". The worker ceiling can pin you
      # below MAX_REPLICAS and trip only the other one.
      - alert: ReplicaCeiling
        expr: autoscaler_current_replicas >= autoscaler_max_replicas
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Replica ceiling reached — capacity plan or app efficiency issue"

      # `service` is the SWARM name (stack_service), set by the vmagent relabel.
      # It must match APP_SERVICE in infra.env — it was `prod_api` from the old
      # two-stack layout, which matched nothing and made this rule dead.
      #
      # `or vector(0)` is load-bearing. In the outage this rule exists to catch,
      # every replica is gone, so the series does not exist — and `sum(nothing)
      # < 1` does not evaluate false, it returns no series at all and never
      # fires. The fallback is what turns "no data" into an alert.
      - alert: NoHealthyReplicas
        expr: (sum(up{job="swarm-services", service="app_api-prod"}) or vector(0)) < 1
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "No healthy app replicas are being scraped"