groups:
  - name: infra
    rules:
      - alert: NodeDown
        expr: up{job="node"} == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "Node {{ $labels.instance }} is not reporting"

      - alert: NodeDiskFilling
        expr: |
          (1 - node_filesystem_avail_bytes{mountpoint="/"}
             / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Disk over 85% on {{ $labels.instance }}"

      - alert: AutoscalerAtMax
        expr: autoscaler_current_workers >= autoscaler_max_workers
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Autoscaler pinned at MAX_WORKERS — raise the ceiling or optimise"

      - alert: AutoscalerStalled
        expr: time() - autoscaler_last_loop_timestamp_seconds > 300
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Autoscaler has not completed a loop in 5 minutes"

  - name: app
    rules:
      - alert: HighErrorRate
        expr: |
          sum by (env) (rate(http_server_requests_seconds_count{status=~"5..",env="prod"}[5m]))
          / sum by (env) (rate(http_server_requests_seconds_count{env="prod"}[5m])) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Over 5% of requests are returning 5xx"

      - alert: SLOBreach
        expr: autoscaler_app_p95_ms > autoscaler_slo_p95_ms
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "p95 is above the SLO and the autoscaler has not recovered it"

      - alert: ReplicaCeiling
        expr: autoscaler_desired_replicas >= autoscaler_current_replicas
          and autoscaler_current_replicas >= 12
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Replica ceiling reached — capacity plan or app efficiency issue"

      - alert: NoHealthyReplicas
        expr: sum(up{job="swarm-services", service="prod_api"}) < 1
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "No healthy app replicas are being scraped"