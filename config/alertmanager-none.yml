# =============================================================================
# ALERTMANAGER — NO DESTINATION CONFIGURED
# =============================================================================
# bin/stack-deploy installs this when ALERT_TELEGRAM_BOT_TOKEN / _CHAT_ID are
# unset, so the monitoring stack still comes up. Every alert is grouped, deduplicated
# and then DROPPED.
#
# That is a real state with a real cost, so it is a file you can find rather
# than a branch buried in a script:
#
#   - stack-deploy prints a warning every time it installs this
#   - `smoke-test` reports it as a failure, not a skip
#   - the Alerts page in the panel says so
#
# Fix it by setting both values in /etc/infra/infra.env and re-running
# `stack-deploy monitoring`, or set them in the panel under Settings.
#
# A receiver with no configs is valid Alertmanager and drops silently. The point
# of this file is that the silence is deliberate and visible, rather than the
# `http://127.0.0.1:9099/noop` placeholder that used to sit here and looked like
# it was working right up until the moment you needed it.
# =============================================================================

route:
  receiver: default
  group_by: [alertname, cluster]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
