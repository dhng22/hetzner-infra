# Replace the webhook with your Slack / Discord / Telegram receiver.
route:
  receiver: default
  group_by: [alertname, cluster]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    webhook_configs:
      - url: "http://127.0.0.1:9099/noop"
        send_resolved: true
