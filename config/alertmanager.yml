# =============================================================================
# ALERTMANAGER
# =============================================================================
# Delivery is wired at bootstrap: ALERT_WEBHOOK_URL from /etc/infra/infra.env
# becomes a docker secret, read here via api_url_file. bootstrap.sh refuses to
# run while it is unset, so this file can no longer silently discard every
# alert the way the old http://127.0.0.1:9099/noop placeholder did.
#
# The URL is treated as a Slack incoming webhook. A Discord webhook works too
# if you append /slack to it. For Telegram or a plain JSON consumer, swap the
# receivers for the webhook_configs form at the bottom of this file.
# =============================================================================

route:
  receiver: default
  group_by: [alertname, cluster]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # The heartbeat fires permanently by design, so it must not ride the 4h
    # repeat with everything else. Its ABSENCE is the signal.
    - matchers:
        - alertname="Watchdog"
      receiver: heartbeat
      group_wait: 0s
      repeat_interval: 24h

receivers:
  - name: default
    slack_configs:
      - api_url_file: /run/secrets/ALERT_WEBHOOK_URL
        send_resolved: true
        title: >-
          [{{ .Status | toUpper }}{{ if eq .Status "firing" }}
          x{{ .Alerts.Firing | len }}{{ end }}]
          {{ .CommonLabels.alertname }}
        # Literal block, not folded: a folded scalar would join every alert in
        # the group onto one unreadable line.
        text: |-
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ end }}

  - name: heartbeat
    slack_configs:
      - api_url_file: /run/secrets/ALERT_WEBHOOK_URL
        send_resolved: false
        title: "Watchdog"
        text: "vmalert -> alertmanager -> webhook is working. Silence here means it is not."

# Plain JSON alternative — replace BOTH receivers above with this shape if your
# consumer is not Slack-compatible:
#
#   - name: default
#     webhook_configs:
#       - url_file: /run/secrets/ALERT_WEBHOOK_URL
#         send_resolved: true
