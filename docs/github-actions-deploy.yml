# =============================================================================
# Reference pipeline for this cluster. Copy into your APP repo as
# .github/workflows/deploy.yml — it does not belong in the infra repo.
#
# The contract it targets:
#   POST https://admin-<app>.<root>/hooks/deploy/<component>
#        X-Deploy-Token: <token from that component's Deployments tab>
#        {"image": "<immutable reference>"}
#
# The deploy is TWO calls: a POST that returns 202 once Swarm accepts the spec,
# then a poll of the status URL it hands back until the rollout is done or
# failed. A rolling update takes minutes and Cloudflare gives an origin 100
# seconds, so a single blocking call cannot answer in time. That
# only works if you let curl's failure propagate — see the notes below.
#
# Deploying is opt-in: with no PANEL_URL / deploy token set, the deploy step
# skips with a warning and the run stays green. Once they are set, every deploy
# failure is fatal again.
# =============================================================================

name: Build & Deploy

on:
  push:
    branches: [main, staging]

# Two pushes in quick succession would otherwise race to update the same
# service, and the loser silently wins. Queue them per branch instead.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # The single immutable reference the deploy job will ship.
      image: ${{ steps.tag.outputs.image }}
      environment: ${{ steps.tag.outputs.environment }}

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tag
        run: |
          set -euo pipefail
          IMAGE=$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          BRANCH=${GITHUB_REF#refs/heads/}
          SHA=${GITHUB_SHA::7}
          if [ "$BRANCH" = "main" ]; then ENVIRONMENT=prod; else ENVIRONMENT=staging; fi

          # Push the moving tag for humans, deploy the immutable one. The panel
          # rejects *-latest on purpose: it gets repointed every build, so
          # deploying it can no-op and still report success.
          {
            echo "tags=${IMAGE}:${ENVIRONMENT}-latest,${IMAGE}:${ENVIRONMENT}-${SHA}"
            echo "image=${IMAGE}:${ENVIRONMENT}-${SHA}"
            echo "environment=${ENVIRONMENT}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tag.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Name it so the run log says which environment moved.
    environment: ${{ needs.build.outputs.environment }}

    steps:
      - name: Deploy to the cluster
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          ENVIRONMENT: ${{ needs.build.outputs.environment }}
          PANEL_URL: ${{ secrets.PANEL_URL }}          # https://admin-<app>.<root>
          # One component, one token. If you run a staging component too, it is
          # a separate component with a separate token — which is also the blast
          # radius you want, since a leaked staging token cannot reach prod.
          COMPONENT: ${{ vars.COMPONENT || 'api' }}
          COMPONENT_STAGING: ${{ vars.COMPONENT_STAGING || 'api-staging' }}
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          TOKEN_STAGING: ${{ secrets.DEPLOY_TOKEN_STAGING }}
        run: |
          set -euo pipefail
          if [ "$ENVIRONMENT" = "staging" ]; then
            TOKEN="$TOKEN_STAGING"; COMPONENT="$COMPONENT_STAGING"
          fi

          # Deploying is opt-in. Until the panel secrets exist there is no endpoint to
          # call, and an unset PANEL_URL means "not wired up yet", not "the deploy broke".
          # Without this the first push from a fresh repo goes red with an HTTP 000 that
          # blames Swarm for a request that was never made.
          #
          # This is the ONLY early exit. Once PANEL_URL and the environment's token are
          # both set, everything below is fatal on failure: a rolled-back deploy must
          # never report green.
          if [ -z "$PANEL_URL" ] || [ -z "$TOKEN" ]; then
            echo "::warning::Deploy skipped — PANEL_URL or the $ENVIRONMENT deploy token is not set. The image was built and pushed: $IMAGE"
            exit 0
          fi

          echo "Deploying $IMAGE to component $COMPONENT"

          # TWO STEPS, and the split is not cosmetic. A rolling update takes
          # parallelism x (monitor + delay) x replicas — minutes, and ten of
          # them at eight replicas. Cloudflare gives an origin 100 seconds and
          # that is not configurable, so the request that waited for the rollout
          # could never answer in time: the proxy returned 524, this step went
          # red, and the deploy it was reporting on succeeded a minute later. A
          # green deploy that fails CI is worse than no check, because it
          # teaches you to ignore the check.
          #
          # So: POST starts it and returns 202, and the poll below is where the
          # verdict comes from. `|| true` on the curls is deliberate — the
          # explicit HTTP_CODE tests are stricter than curl's exit code, and
          # without it `set -e` aborts before anything useful is printed.
          HTTP_CODE=$(curl -sS -o response.json -w '%{http_code}' \
            --max-time 60 \
            -X POST "$WEBHOOK_URL" \
            -H "X-Deploy-Token: ${TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "{\"image\": \"${IMAGE}\"}" || true)
          HTTP_CODE=${HTTP_CODE:-000}

          echo "--- panel response (HTTP $HTTP_CODE) ---"
          # Guard the cat: curl does not create -o's file when it never
          # connects, and a bare `cat` would kill the step under `set -e` before
          # the ::error:: prints — blind in exactly the case you need it.
          cat response.json 2>/dev/null || echo "(no response body — the request never completed)"
          echo

          if [ "$HTTP_CODE" != "202" ] && [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Deploy was not accepted (HTTP $HTTP_CODE). Swarm never started the update."
            exit 1
          fi

          STATUS_URL=$(python3 -c "import json;print(json.load(open('response.json')).get('status_url',''))" 2>/dev/null || true)
          if [ -z "$STATUS_URL" ]; then
            STATUS_URL="${WEBHOOK_URL%/}/status"
          fi

          echo "Update accepted. Waiting for Swarm to converge..."

          # Budget: comfortably past the worst rollout this service can produce,
          # so a slow deploy is never reported as a failure. Each poll is its own
          # short request, so no single one can hit a proxy timeout.
          DEADLINE=$(( SECONDS + 900 ))
          STATUS=pending
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            sleep 10
            CODE=$(curl -sS -o status.json -w '%{http_code}' --max-time 30 \
              "$STATUS_URL" -H "X-Deploy-Token: ${TOKEN}" || true)
            [ "$CODE" = "200" ] || { echo "  (status check returned HTTP ${CODE:-000}, retrying)"; continue; }
            STATUS=$(python3 -c "import json;print(json.load(open('status.json')).get('status','pending'))" 2>/dev/null || echo pending)
            RUNNING=$(python3 -c "import json;print(json.load(open('status.json')).get('image',''))" 2>/dev/null || echo "")
            echo "  status=$STATUS running=${RUNNING:-unknown}"
            [ "$STATUS" = "pending" ] || break
          done

          if [ "$STATUS" = "failed" ]; then
            echo "::error::Swarm rolled the update back — $IMAGE is NOT live. The previous version is still serving. Check the component's Logs tab for why the new tasks exited."
            exit 1
          fi
          if [ "$STATUS" != "done" ]; then
            echo "::error::Timed out after 15 minutes with the rollout still in progress. The deploy may yet succeed; check the panel's Deployments tab."
            exit 1
          fi

          # Converged — but converged ON WHAT. A rollback that completes cleanly
          # also reports done, and so does an unrelated update that overtook us,
          # so the image is checked rather than assumed.
          case "${RUNNING:-}" in
            *"${IMAGE##*:}"*) echo "Deployed $IMAGE" ;;
            "") echo "::warning::Converged, but the panel did not report which image is running." ;;
            *) echo "::error::Converged on $RUNNING, not $IMAGE — something else deployed over this build."
               exit 1 ;;
          esac
